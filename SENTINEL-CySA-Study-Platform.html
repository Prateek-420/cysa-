<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — CySA+ CS0-004 Ops Academy</title>
<meta name="description" content="Interactive CompTIA CySA+ CS0-004 study platform. Build 2026-07-10">
<style>/* ============ SENTINEL design system ============ */
:root {
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Code', 'Consolas', monospace;
  --radius: 14px;
  --radius-sm: 9px;
  /* domain colours (stable across themes) */
  --d1: #22d3ee; --d1-soft: rgba(34,211,238,.14);
  --d2: #fbbf24; --d2-soft: rgba(251,191,36,.14);
  --d3: #fb7185; --d3-soft: rgba(251,113,133,.14);
  --d4: #a78bfa; --d4-soft: rgba(167,139,250,.14);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.15);
  --bad: #f87171; --bad-soft: rgba(248,113,113,.15);
  --warn: #fbbf24; --warn-soft: rgba(251,191,36,.13);
  --xp: #f0abfc;
}
[data-theme="dark"] {
  --bg: #0a0f1e; --bg2: #0f1629; --card: #141c33; --card2: #1a2440;
  --line: #24304f; --line2: #2e3c61;
  --text: #e6ecff; --text2: #9fb0d6; --text3: #6b7ca6;
  --accent: #22d3ee; --accent2: #0ea5b7; --accent-soft: rgba(34,211,238,.12);
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --glow: 0 0 24px rgba(34,211,238,.18);
}
[data-theme="light"] {
  --bg: #f2f5fb; --bg2: #e9edf7; --card: #ffffff; --card2: #f4f7fd;
  --line: #dbe2f0; --line2: #c8d2e6;
  --text: #16203a; --text2: #48557a; --text3: #7c88a8;
  --accent: #0891b2; --accent2: #0e7490; --accent-soft: rgba(8,145,178,.10);
  --shadow: 0 8px 24px rgba(30,45,90,.10);
  --glow: none;
  --d1: #0891b2; --d2: #b45309; --d3: #be123c; --d4: #7c3aed;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
body::before { /* subtle grid backdrop */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px; opacity: .14;
}
#app { position: relative; z-index: 1; }
button { font-family: inherit; cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); }

/* ---------- layout ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--line);
  padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 4px; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  display: grid; place-items: center; font-weight: 800; font-size: 19px; color: #fff;
  box-shadow: var(--glow);
}
.brand-name { font-weight: 800; letter-spacing: 2.5px; font-size: 15px; }
.brand-sub { font-size: 10.5px; color: var(--text3); letter-spacing: .5px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 11px 13px; border: none; background: transparent; color: var(--text2);
  border-radius: var(--radius-sm); font-size: 14.5px; font-weight: 600; text-align: left;
  transition: background .15s, color .15s;
}
.nav-btn:hover { background: var(--card); color: var(--text); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); }
.nav-btn .ico { font-size: 17px; width: 22px; text-align: center; }
.sidebar-foot { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--text3); }
.main { flex: 1; min-width: 0; padding: 26px clamp(16px, 4vw, 44px) 90px; max-width: 1060px; margin: 0 auto; }

/* topbar chips */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px;
  background: var(--card); border: 1px solid var(--line); border-radius: 99px;
  font-size: 13px; font-weight: 600; color: var(--text2);
}
.chip b { color: var(--text); }
.chip.streak b { color: #fb923c; }
.chip.xp b { color: var(--xp); }
.spacer { flex: 1; }

/* ---------- cards & common ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px 22px; box-shadow: var(--shadow);
}
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -.3px; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; }
.muted { color: var(--text2); font-size: 14px; }
.tiny { color: var(--text3); font-size: 12px; }
.mt { margin-top: 14px; } .mt2 { margin-top: 22px; } .mb { margin-bottom: 14px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
}
.badge.dom-1 { background: var(--d1-soft); color: var(--d1); }
.badge.dom-2 { background: var(--d2-soft); color: var(--d2); }
.badge.dom-3 { background: var(--d3-soft); color: var(--d3); }
.badge.dom-4 { background: var(--d4-soft); color: var(--d4); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.neutral { background: var(--accent-soft); color: var(--accent); }

/* progress bars */
.pbar { height: 9px; background: var(--bg2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.pbar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #7c3aed); transition: width .5s cubic-bezier(.3,1,.4,1); }
.pbar.thick { height: 14px; }
.pbar > i.c1 { background: var(--d1); } .pbar > i.c2 { background: var(--d2); }
.pbar > i.c3 { background: var(--d3); } .pbar > i.c4 { background: var(--d4); }
.pbar > i.ok { background: var(--ok); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; border-radius: var(--radius-sm); border: 1px solid var(--line2);
  background: var(--card2); color: var(--text); font-size: 15px; font-weight: 700;
  transition: transform .1s, background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #04212b; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.big { padding: 15px 30px; font-size: 16.5px; border-radius: 12px; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 8px 14px; font-size: 13px; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ok { background: var(--ok); border: none; color: #052e1c; }
.btn.warnb { background: var(--warn); border: none; color: #3a2703; }

/* ---------- day / plan list ---------- */
.day-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
  color: var(--text); text-align: left; transition: border-color .15s, transform .1s;
}
.day-row:hover { border-color: var(--accent); transform: translateX(3px); }
.day-row.locked { opacity: .55; }
.day-row.done { border-left: 4px solid var(--ok); }
.day-row.current { border-left: 4px solid var(--accent); box-shadow: var(--glow); }
.day-num {
  width: 42px; height: 42px; flex-shrink: 0; border-radius: 11px; display: grid; place-items: center;
  font-weight: 800; font-size: 15px; background: var(--bg2); border: 1px solid var(--line2);
}
.day-num.d1 { color: var(--d1); } .day-num.d2 { color: var(--d2); }
.day-num.d3 { color: var(--d3); } .day-num.d4 { color: var(--d4); }
.day-info { flex: 1; min-width: 0; }
.day-title { font-weight: 700; font-size: 15px; }
.day-meta { font-size: 12px; color: var(--text3); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
.day-check { font-size: 20px; }

/* week header */
.week-head { display: flex; align-items: center; gap: 12px; margin: 24px 0 10px; }
.week-head h3 { color: var(--text2); font-size: 13.5px; text-transform: uppercase; letter-spacing: 1.5px; }
.week-head::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ---------- lesson ---------- */
.lesson-section { margin-bottom: 18px; }
.lesson-section h2 {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 18px;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.lesson-section h2 .num {
  width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 13px; flex-shrink: 0;
}
.lesson-block { margin-bottom: 12px; font-size: 15px; color: var(--text); }
.lesson-block p { margin-bottom: 8px; }
.lesson-block ul { padding-left: 22px; display: grid; gap: 6px; }
.lesson-block li::marker { color: var(--accent); }
.callout { padding: 13px 16px; border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 12px; border: 1px solid; }
.callout.tip { background: var(--accent-soft); border-color: var(--accent); }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.callout.exam { background: var(--d4-soft); border-color: var(--d4); }
.callout.soc { background: var(--ok-soft); border-color: var(--ok); }
.callout b:first-child { display: block; margin-bottom: 4px; font-size: 12.5px; letter-spacing: 1px; text-transform: uppercase; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 12px; }
.tbl th { text-align: left; padding: 9px 12px; background: var(--bg2); color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:hover td { background: var(--card2); }
.code {
  font-family: var(--mono); font-size: 13px; background: var(--bg2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 13px 15px; overflow-x: auto; margin-bottom: 12px;
  white-space: pre; line-height: 1.6; color: var(--text);
}
.diagram { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin-bottom: 12px; }
.diagram .node {
  flex: 1; min-width: 110px; padding: 11px 13px; border-radius: var(--radius-sm); text-align: center;
  background: var(--card2); border: 1px solid var(--line2); font-size: 13px; font-weight: 600;
  position: relative; transition: border-color .15s, transform .12s;
}
.diagram .node:hover { border-color: var(--accent); transform: translateY(-2px); }
.diagram .node small { display: block; font-weight: 400; color: var(--text3); font-size: 11px; margin-top: 3px; }
.diagram .arrow { align-self: center; color: var(--accent); font-size: 17px; font-weight: 800; }

/* objectives checklist */
.obj-list { display: grid; gap: 8px; }
.obj-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 14px; }
.obj-item .tick { color: var(--accent); font-weight: 800; }

/* stepper for lesson flow */
.stepper { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.step-pill {
  padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid var(--line);
  background: var(--card); color: var(--text3);
}
.step-pill.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.step-pill.done { color: var(--ok); border-color: var(--ok); }

/* ---------- flashcards ---------- */
.fc-stage { perspective: 1400px; max-width: 640px; margin: 0 auto; }
.fc-card {
  position: relative; min-height: 320px; cursor: pointer; transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.3,1.2,.4,1);
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px;
  background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow);
  padding: 30px 32px; display: flex; flex-direction: column;
}
.fc-face.back { transform: rotateY(180deg); overflow-y: auto; }
.fc-q { font-size: 19px; font-weight: 700; flex: 1; display: grid; place-items: center; text-align: center; }
.fc-a { font-size: 17px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
.fc-exp { font-size: 14px; color: var(--text2); margin-bottom: 10px; }
.fc-hint { text-align: center; color: var(--text3); font-size: 12px; margin-top: 12px; }
.fc-actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.fc-counter { text-align: center; margin-bottom: 12px; color: var(--text2); font-size: 14px; font-weight: 600; }
.mastery-dots { display: flex; gap: 3px; }
.mastery-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line2); }
.mastery-dots i.on { background: var(--ok); }

/* ---------- quiz ---------- */
.q-card { margin-bottom: 16px; }
.q-scenario {
  font-size: 13.5px; font-family: var(--mono); background: var(--bg2); border-left: 3px solid var(--accent);
  padding: 12px 15px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 14px;
  white-space: pre-wrap; overflow-x: auto;
}
.q-text { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.q-opts { display: grid; gap: 10px; }
.q-opt {
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; width: 100%; text-align: left;
  background: var(--card2); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  color: var(--text); font-size: 14.5px; transition: border-color .12s, background .12s;
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); }
.q-opt .key {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 7px; display: grid; place-items: center;
  background: var(--bg2); border: 1px solid var(--line2); font-weight: 800; font-size: 12.5px;
}
.q-opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.q-opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q-explain { margin-top: 14px; display: grid; gap: 10px; }
.q-result-banner { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }

/* exam */
.exam-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.exam-timer { font-family: var(--mono); font-size: 20px; font-weight: 700; padding: 8px 16px; background: var(--card); border: 1px solid var(--line2); border-radius: var(--radius-sm); }
.exam-timer.low { color: var(--bad); border-color: var(--bad); animation: pulse 1s infinite; }
.exam-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.exam-nav button {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  color: var(--text2); font-weight: 700; font-size: 12.5px;
}
.exam-nav button.answered { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.exam-nav button.flagged { border-color: var(--warn); color: var(--warn); }
.exam-nav button.cur { outline: 2px solid var(--accent); }
.exam-nav button.res-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.exam-nav button.res-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

/* score ring */
.ring-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ring { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; }

/* ---------- PBQ ---------- */
.pbq-term {
  font-family: var(--mono); font-size: 13px; background: #060b16; color: #c9e8ff; border: 1px solid var(--line2);
  border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; white-space: pre; line-height: 1.65; margin-bottom: 14px;
}
[data-theme="light"] .pbq-term { background: #101828; }
.pbq-slot {
  display: inline-flex; min-width: 130px; min-height: 34px; padding: 4px 10px; margin: 2px;
  border: 1.5px dashed var(--line2); border-radius: 8px; align-items: center; justify-content: center;
  font-size: 13px; background: var(--bg2); vertical-align: middle;
}
.pbq-slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.pbq-slot.ok { border-color: var(--ok); background: var(--ok-soft); }
.pbq-slot.bad { border-color: var(--bad); background: var(--bad-soft); }
.pbq-bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.pbq-chip {
  padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line2); background: var(--card2);
  font-size: 13px; font-weight: 600; color: var(--text); transition: transform .1s;
}
.pbq-chip:hover { border-color: var(--accent); transform: translateY(-2px); }
.pbq-chip.used { opacity: .35; pointer-events: none; }
.pbq-chip.armed { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- dashboard ---------- */
.stat-card { text-align: center; padding: 18px 14px; }
.stat-card .big { font-size: 30px; font-weight: 800; }
.stat-card .lbl { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
.level-band { display: flex; align-items: center; gap: 16px; }
.level-badge {
  width: 62px; height: 62px; border-radius: 16px; flex-shrink: 0; display: grid; place-items: center;
  background: linear-gradient(135deg, #7c3aed, var(--accent)); color: #fff; font-size: 24px; font-weight: 800;
  box-shadow: var(--glow);
}
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.ach {
  text-align: center; padding: 14px 8px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--card2); font-size: 12px; font-weight: 600;
}
.ach .ico { font-size: 26px; display: block; margin-bottom: 6px; }
.ach.locked { opacity: .35; filter: grayscale(1); }
.ach.earned { border-color: var(--warn); }

/* heat calendar */
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--bg2); border: 1px solid var(--line); }
.heat i.h1 { background: rgba(34,211,238,.25); } .heat i.h2 { background: rgba(34,211,238,.55); }
.heat i.h3 { background: var(--accent); }

/* ---------- misc ---------- */
.search-input, select.search-input {
  width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--line2);
  background: var(--card); color: var(--text); font-size: 14.5px; font-family: inherit;
}
.search-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-pill {
  padding: 8px 15px; border-radius: 99px; border: 1px solid var(--line); background: var(--card);
  color: var(--text2); font-size: 13px; font-weight: 700;
}
.filter-pill.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.filter-pill.on.f1 { background: var(--d1-soft); color: var(--d1); border-color: var(--d1); }
.filter-pill.on.f2 { background: var(--d2-soft); color: var(--d2); border-color: var(--d2); }
.filter-pill.on.f3 { background: var(--d3-soft); color: var(--d3); border-color: var(--d3); }
.filter-pill.on.f4 { background: var(--d4-soft); color: var(--d4); border-color: var(--d4); }

#toast-root { position: fixed; bottom: 24px; right: 24px; z-index: 100; display: grid; gap: 10px; }
.toast {
  background: var(--card); border: 1px solid var(--accent); border-radius: var(--radius-sm);
  padding: 13px 18px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow);
  animation: slideIn .3s cubic-bezier(.2,1,.4,1); display: flex; gap: 10px; align-items: center; max-width: 320px;
}
.toast.xp { border-color: var(--xp); }
#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
@keyframes pulse { 50% { opacity: .5; } }
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
.pop { animation: popIn .25s cubic-bezier(.2,1.4,.4,1); }

.mobile-nav { display: none; }

/* countdown */
.count-wrap { display: flex; gap: 10px; }
.count-cell { text-align: center; background: var(--card2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; min-width: 66px; }
.count-cell b { font-size: 22px; display: block; }
.count-cell span { font-size: 10.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .main { padding: 18px 14px 110px; }
  .mobile-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--bg2); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-nav button {
    flex: 1; background: none; border: none; color: var(--text3); font-size: 10.5px; font-weight: 700;
    display: flex; flex-direction: column; gap: 3px; align-items: center; padding: 6px 2px;
  }
  .mobile-nav button .ico { font-size: 19px; }
  .mobile-nav button.active { color: var(--accent); }
  .fc-card { min-height: 360px; }
  .heat { grid-template-columns: repeat(7, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<canvas id="confetti-canvas"></canvas>
<div id="toast-root"></div>
<script>/* ============ Days 1-5: SOC foundations & architecture (Domain 1) ============ */
'use strict';

const DAYS = [];

DAYS.push({
  day: 1, domain: 1, icon: '🏢', title: 'The Modern SOC & Security Controls', minutes: 35,
  objectives: [
    'Describe the role of a Tier 2 SOC analyst and the SOC tiering model',
    'Classify security controls by category (managerial, operational, technical) and function (preventive, detective, responsive/corrective)',
    'Identify the core modern SOC technology stack: SIEM, SOAR, EDR, XDR, UEBA',
  ],
  lesson: [
    { h: 'Where you fit: the SOC tier model', blocks: [
      { t: 'p', x: 'A Security Operations Center (SOC) is the team that continuously monitors, detects, and responds to threats. Most SOCs use a tier model to route work:' },
      { t: 'flow', x: [{ l: 'Tier 1', s: 'Triage: validate alerts, close false positives, escalate' }, { l: 'Tier 2', s: 'Investigate: correlate, hunt, contain incidents' }, { l: 'Tier 3', s: 'Expert: forensics, malware RE, detection engineering' }] },
      { t: 'p', x: 'This platform trains you to think at **Tier 2**: you receive an escalated alert, pull evidence from multiple tools, decide if it is a true incident, and drive the response.' },
      { t: 'soc', x: 'Tier 1 escalates an alert: "PowerShell spawned from Word on FINANCE-PC-07." A Tier 2 analyst doesn\'t just close or block — they ask: what did the PowerShell do? Any network connections? Other hosts affected? Evidence preserved?' },
    ]},
    { h: 'Security control categories & functions', blocks: [
      { t: 'p', x: 'CompTIA classifies every safeguard two ways: **who/how it is implemented** (category) and **what it does relative to an attack** (function). You must be able to classify any control both ways.' },
      { t: 'table', head: ['Category', 'Meaning', 'Examples'], rows: [
        ['Managerial', 'Oversight, policy, risk decisions', 'Risk assessments, security policies, vendor reviews'],
        ['Operational', 'Performed by people, day to day', 'Guard patrols, awareness training, log review procedures'],
        ['Technical', 'Implemented by systems', 'Firewalls, encryption, EDR, IAM'],
      ]},
      { t: 'table', head: ['Function', 'Timing', 'Examples'], rows: [
        ['Preventive', 'Blocks the attack before it succeeds', 'ACLs, MFA, hardening'],
        ['Detective', 'Identifies the attack during/after', 'SIEM alerts, IDS, audit logs'],
        ['Responsive / Corrective', 'Reacts and restores after', 'IR playbooks, patching, restore from backup'],
        ['Compensating', 'Alternative when the primary control is not feasible', 'Extra monitoring around an unpatchable legacy server'],
      ]},
      { t: 'exam', x: 'A single technology can serve multiple functions. An EDR agent is technical + detective (alerting) **and** responsive (isolating a host). Read the scenario for what the control is *doing* in that sentence.' },
    ]},
    { h: 'The modern SOC stack', blocks: [
      { t: 'table', head: ['Tech', 'What it does', 'Analyst use'], rows: [
        ['SIEM', 'Central log ingestion, correlation, alerting (Splunk, Sentinel, Elastic, QRadar)', 'Your primary investigation console'],
        ['SOAR', 'Automates response playbooks across tools via APIs', 'Auto-enrich IOCs, quarantine hosts, open tickets'],
        ['EDR', 'Endpoint telemetry + detection + response (CrowdStrike, Defender for Endpoint)', 'Process trees, isolate host, kill process'],
        ['XDR', 'Extends EDR correlation across endpoint, email, cloud, identity, network', 'One correlated incident instead of five alerts'],
        ['UEBA', 'Baselines user/entity behaviour, flags anomalies', 'Impossible travel, unusual data access volumes'],
      ]},
      { t: 'tip', x: 'Memory hook: SIEM **sees**, SOAR **acts**, EDR **lives on the endpoint**, XDR **stitches it together**, UEBA **knows what normal looks like**.' },
      { t: 'p', x: 'AI is now woven through this stack (CS0-004 change): SIEMs use ML anomaly detection, SOAR platforms use LLM assistants to summarise incidents, and EDR vendors use models to score process behaviour. Days 14–15 cover AI in depth.' },
    ]},
  ],
  flashcards: [
    { f: 'A policy requiring quarterly risk assessments is what control category?', b: 'Managerial', exp: 'Managerial (administrative) controls govern risk and oversight rather than being performed by staff daily or enforced by technology.', tip: 'Policy/risk/governance words = managerial.' },
    { f: 'What control function does a SIEM alert serve?', b: 'Detective', exp: 'It identifies malicious activity that is occurring or has occurred; it does not block it.', tip: 'Detection ≠ prevention — SIEM never blocks on its own.' },
    { f: 'Which SOC tier typically performs initial alert triage and false-positive filtering?', b: 'Tier 1', exp: 'Tier 1 validates alerts against runbooks and escalates suspicious ones to Tier 2 for investigation.' },
    { f: 'What technology automates response playbooks by connecting tools through APIs?', b: 'SOAR (Security Orchestration, Automation, and Response)', exp: 'SOAR executes workflows — enrich an IOC, quarantine a host, notify a channel — without a human clicking through each tool.', tip: 'Keyword "playbook automation" or "reduce repetitive analyst tasks" → SOAR.' },
    { f: 'How does XDR differ from EDR?', b: 'XDR correlates detections across multiple layers (endpoint, email, identity, cloud, network); EDR covers endpoints only.', exp: 'XDR reduces alert fatigue by merging related signals into one incident.', tip: 'If the scenario mentions correlating endpoint + email + cloud telemetry, the answer is XDR.' },
    { f: 'Which technology flags a user downloading 10× their normal data volume at 3 a.m.?', b: 'UEBA (User and Entity Behavior Analytics)', exp: 'UEBA builds statistical baselines of normal behaviour per user/entity and alerts on deviations.', tip: '"Deviation from baseline behaviour" = UEBA.' },
    { f: 'A legacy server cannot be patched, so extra network monitoring and segmentation are added. What type of control is this?', b: 'Compensating control', exp: 'A compensating control provides equivalent protection when the primary control (patching) is not feasible.', tip: 'CompTIA loves compensating controls in vuln management scenarios.' },
    { f: 'Name the three impact pillars of the CIA triad.', b: 'Confidentiality, Integrity, Availability', exp: 'Every security decision maps to protecting one or more of these. CVSS scores impact against exactly these three.', tip: 'CVSS impact metrics are literally C/I/A — connect the two.' },
  ],
  quiz: [
    { q: 'A company implements mandatory security awareness training delivered by the HR team every quarter. Which control category and function best describe this?', opts: ['Technical, preventive', 'Operational, preventive', 'Managerial, detective', 'Operational, corrective'], a: 1, why: 'Training is performed by people as part of day-to-day operations (operational) and aims to stop incidents before they happen (preventive).', whyNot: 'It is not enforced by a system (not technical), it is the execution of training rather than the governing policy (not managerial), and it acts before incidents, not after (not corrective).', trap: 'The *policy requiring* training would be managerial; *delivering* it is operational. CompTIA tests this distinction.' },
    { sc: 'ALERT | src: EDR | host: FIN-WS-112\nWinWord.exe → powershell.exe -enc JABzAD0A...\nAction taken: none (detect-only mode)', q: 'Tier 1 escalates this alert to you. What is the MOST appropriate first action as a Tier 2 analyst?', opts: ['Re-image the workstation immediately', 'Investigate the process tree and decoded command to scope the activity', 'Close the alert as a false positive since no action was taken', 'Email the user asking if they opened a document'], a: 1, why: 'Tier 2 validates and scopes before responding: decode the base64 command, examine the process tree, and check for network connections or persistence.', whyNot: 'Re-imaging destroys evidence before scoping; closing without investigation ignores a classic malicious pattern (Office spawning encoded PowerShell); emailing the user is unreliable and may tip off an insider.', trap: 'CompTIA answers usually follow the IR order: analyze/scope BEFORE containment or eradication — unless active damage is stated.' },
    { q: 'Which technology would BEST reduce the time analysts spend manually enriching IP addresses in phishing tickets across three different tools?', opts: ['UEBA', 'SOAR', 'XDR', 'IDS'], a: 1, why: 'SOAR automates repetitive multi-tool workflows: pull the IP, query threat intel, attach results to the ticket automatically.', whyNot: 'UEBA is behavioural baselining; XDR is cross-layer detection correlation, not workflow automation; IDS only detects network attacks.', trap: '"Repetitive manual task across tools" is the SOAR trigger phrase.' },
    { q: 'An analyst adds host isolation capability so infected laptops can be cut off from the network with one click. Which control function does this add?', opts: ['Preventive', 'Detective', 'Responsive/Corrective', 'Managerial'], a: 2, why: 'Isolation reacts to an incident in progress to limit damage — a responsive/corrective function.', whyNot: 'It does not stop the initial infection (preventive) or identify it (detective); managerial is a category, not a function.', trap: 'Watch for questions mixing categories and functions in the same option list.' },
    { q: 'Which statement BEST describes the value XDR adds over a traditional SIEM + EDR deployment?', opts: ['It replaces the need for log retention', 'It natively correlates telemetry across endpoint, identity, email, and cloud into unified incidents', 'It blocks 100% of zero-day attacks using AI', 'It removes the need for Tier 1 analysts'], a: 1, why: 'XDR\'s core value is native cross-layer correlation, producing fewer, higher-fidelity incidents.', whyNot: 'Retention/compliance remains a SIEM job; nothing blocks 100% of zero-days (absolute claims are almost always wrong); tiers still exist even with automation.', trap: 'Options containing "100%", "always", or "eliminates the need" are nearly always incorrect on CompTIA exams.' },
    { q: 'During an audit, a finding notes there is no documented process for reviewing firewall rules. Recommending a scheduled review procedure is what type of control?', opts: ['Technical, detective', 'Operational, preventive', 'Managerial, preventive', 'Technical, corrective'], a: 2, why: 'Creating a documented, mandated review process is governance/oversight (managerial) intended to prevent misconfigurations from persisting (preventive).', whyNot: 'No system enforces it (not technical); the *procedure requirement* is governance, while the person actually reviewing each week would be operational.', trap: 'Documented processes, standards, and requirements = managerial.' },
  ],
  recap: [
    'Tier 1 triages, **Tier 2 investigates and scopes**, Tier 3 does deep forensics/engineering',
    'Controls: managerial/operational/technical × preventive/detective/responsive + compensating',
    'SIEM sees, SOAR acts, EDR lives on endpoints, XDR stitches layers, UEBA knows normal',
    'Investigate and scope before containing — unless damage is actively spreading',
  ],
});

DAYS.push({
  day: 2, domain: 1, icon: '🧾', title: 'Logging, OS Concepts & System Hardening', minutes: 40,
  objectives: [
    'Explain log ingestion, time synchronization, and logging levels',
    'Recall key Windows (Registry, processes, file structure) and Linux artefact locations',
    'Describe system hardening and configuration baselines (CIS Benchmarks)',
  ],
  lesson: [
    { h: 'Log ingestion: garbage in, garbage out', blocks: [
      { t: 'p', x: 'Every SIEM investigation depends on logs arriving **complete, timely, and time-synchronized**. Ingestion is how logs get from sources into your SIEM (agents, syslog, APIs, cloud event hubs).' },
      { t: 'list', x: [
        '**Time synchronization (NTP)** — if hosts disagree on time, you cannot build an attack timeline. All devices should sync to a common NTP source; SIEMs normalise to UTC.',
        '**Logging levels** — verbosity settings (e.g., syslog severities 0 Emergency → 7 Debug). Too low = missed evidence; Debug everywhere = storage blowout and noise.',
        '**Normalization/parsing** — mapping raw events to common fields (src_ip, user, action) so correlation rules work across vendors.',
      ]},
      { t: 'warn', x: 'Classic exam scenario: events from two servers appear out of order or an attack timeline "doesn\'t make sense" → the answer is almost always **NTP/time sync misconfiguration**.' },
      { t: 'soc', x: 'You correlate a phishing click at 14:02 with a C2 beacon at 13:47 — before the click? Check timezone handling and NTP drift before assuming the beacon came first.' },
    ]},
    { h: 'Windows internals for analysts', blocks: [
      { t: 'table', head: ['Artefact', 'Why analysts care'], rows: [
        ['Windows Registry', 'Configuration + classic persistence: `Run`/`RunOnce` keys, services. Malware hides autoruns here.'],
        ['Event Logs', 'Security (4624 logon, 4625 failed logon, 4688 process creation, 4720 account created), System, Application, PowerShell Operational.'],
        ['System processes', 'Know normal: one `lsass.exe` from `wininit.exe`; `svchost.exe` always child of `services.exe`. Wrong parent/path/spelling = suspicious.'],
        ['File structure', 'Config and binaries: `C:\\Windows\\System32`, user profiles under `C:\\Users`, temp dirs abused for staging payloads.'],
      ]},
      { t: 'code', x: 'Red flags in a process listing:\n  svchost.exe   parent: explorer.exe     ← wrong parent (should be services.exe)\n  lsass.exe     path: C:\\Temp\\lsass.exe  ← wrong path (should be System32)\n  scvhost.exe                            ← typosquatted name' },
      { t: 'exam', x: 'Memorise event IDs 4624 (logon success), 4625 (logon failure), 4688 (new process), 4720 (user account created). They appear in log-analysis questions and PBQs.' },
    ]},
    { h: 'Linux essentials', blocks: [
      { t: 'table', head: ['Location', 'Contains'], rows: [
        ['/var/log/ (auth.log, syslog, secure)', 'Authentication and system events'],
        ['/etc/passwd, /etc/shadow', 'Accounts; password hashes (shadow is root-only)'],
        ['/etc/crontab, /var/spool/cron', 'Scheduled tasks — persistence favourite'],
        ['~/.bash_history', 'Command history per user'],
        ['/etc/ + service dirs', 'Configuration files (e.g., /etc/ssh/sshd_config)'],
      ]},
    ]},
    { h: 'Hardening & baselines', blocks: [
      { t: 'p', x: '**Hardening** = reducing attack surface: remove unneeded services/software, close ports, least privilege, patch, enforce secure configs.' },
      { t: 'list', x: [
        '**CIS Benchmarks** — industry consensus hardening guides per OS/application; scanners test compliance against them ("security baseline scanning").',
        '**Configuration baseline** — the approved secure state; drift from baseline is itself an indicator worth alerting on.',
        '**Attack surface** — every listening port, enabled service, and account is a door. Fewer doors, fewer break-ins.',
      ]},
      { t: 'tip', x: 'Modern angle: baseline scanning is automated with tools like Nessus/OpenVAS compliance policies, or cloud-native config scanners (Prowler for AWS, ScoutSuite multi-cloud) — covered on Day 18.' },
    ]},
  ],
  flashcards: [
    { f: 'Windows Event ID 4625 means what?', b: 'Failed logon attempt', exp: 'A burst of 4625s followed by a 4624 (success) on the same account is the classic brute-force/password-spray pattern.', tip: '4624 success, 4625 failure, 4688 process creation, 4720 account created.' },
    { f: 'Why is NTP critical to SOC operations?', b: 'Accurate, synchronized timestamps make cross-system event correlation and attack timelines possible.', exp: 'Unsynchronized clocks make events appear out of order and can invalidate forensic timelines (and evidence admissibility).', tip: 'Timeline "doesn\'t add up" in a scenario → time sync is the answer.' },
    { f: 'Which Registry keys are the classic malware persistence location?', b: 'HKLM/HKCU ...\\Software\\Microsoft\\Windows\\CurrentVersion\\Run (and RunOnce)', exp: 'Programs listed there auto-execute at boot/logon. Autoruns review is a standard host triage step.' },
    { f: 'What is the legitimate parent process of svchost.exe?', b: 'services.exe', exp: 'svchost.exe launched by anything else (explorer.exe, winword.exe, cmd.exe) indicates process masquerading or injection.', tip: 'Parent-child anomalies are a favourite PBQ element.' },
    { f: 'Where are Linux authentication events typically logged?', b: '/var/log/auth.log (Debian/Ubuntu) or /var/log/secure (RHEL)', exp: 'SSH logins, sudo usage, and PAM events land here — first stop when investigating a Linux host.' },
    { f: 'What are CIS Benchmarks?', b: 'Consensus-based secure configuration (hardening) guides for OSes, cloud platforms, and applications', exp: 'Security baseline scans compare systems against benchmarks like CIS to detect misconfigurations.', tip: '"Industry-accepted hardening guide" → CIS Benchmarks.' },
    { f: 'Give three examples of system hardening.', b: 'Disable unneeded services, remove default accounts/credentials, close unused ports, apply patches, enforce least privilege', exp: 'Hardening shrinks the attack surface before an attacker ever arrives — a preventive technical control.' },
    { f: 'What logging level problem causes both storage blowout and analyst alert fatigue?', b: 'Logging set too verbose (e.g., Debug) in production', exp: 'Logging levels must balance evidence completeness against volume; tune per source criticality.' },
  ],
  quiz: [
    { sc: 'SIEM correlation output:\n10:15:03 HOST-A  4688 powershell.exe\n10:02:47 HOST-B  4624 logon from HOST-A\nAnalyst note: "HOST-B logon happened BEFORE the PowerShell that caused it??"', q: 'What is the MOST likely explanation?', opts: ['The attacker used time-stomping malware on both hosts', 'HOST-B is compromised by a different actor', 'The hosts are not synchronized to a common NTP source', 'The SIEM license expired'], a: 2, why: 'Out-of-order events across two hosts almost always indicate clock drift from missing/misconfigured NTP.', whyNot: 'Time-stomping alters file MACE times, not live event log ordering across hosts; a second actor doesn\'t explain impossible ordering; licensing wouldn\'t reorder events.', trap: 'Don\'t reach for exotic attacker explanations when a mundane infrastructure issue fits — CompTIA rewards the simplest valid cause.' },
    { q: 'Which Windows Event ID would you filter on to find newly created user accounts during a suspected persistence hunt?', opts: ['4624', '4688', '4720', '4625'], a: 2, why: '4720 = "A user account was created." Attackers create local accounts as backup access.', whyNot: '4624 is a successful logon, 4688 process creation, 4625 failed logon.', trap: 'Memorise the four IDs — the exam gives you the number, not the description.' },
    { sc: 'Process listing (EDR):\nPID 812  services.exe\nPID 1044 svchost.exe   parent 812\nPID 3720 svchost.exe   parent 2288 (explorer.exe)', q: 'Which finding warrants investigation?', opts: ['PID 1044 — svchost should not run multiple instances', 'PID 3720 — svchost.exe spawned by explorer.exe', 'PID 812 — services.exe should not be running', 'Nothing — all entries are normal'], a: 1, why: 'svchost.exe must be a child of services.exe. One spawned by explorer.exe suggests masquerading — likely malware named svchost.exe or injected.', whyNot: 'Multiple svchost instances are completely normal (dozens on a healthy system); services.exe is a core process.', trap: 'Multiple svchost processes = normal. Wrong PARENT or wrong PATH = suspicious.' },
    { q: 'A vulnerability scan reports a server "fails CIS Benchmark section 2.2.1 – Ensure Telnet is not enabled." What activity does this finding come from?', opts: ['Penetration testing', 'Security baseline/compliance scanning', 'Fuzzing', 'Threat hunting'], a: 1, why: 'Comparing system configuration against a hardening benchmark is security baseline (compliance) scanning.', whyNot: 'Pen testing actively exploits; fuzzing throws malformed input at software; threat hunting looks for active adversaries, not config drift.' },
    { q: 'An admin wants to reduce a new web server\'s attack surface before deployment. Which set of actions accomplishes this?', opts: ['Enable debug logging, install monitoring agents, snapshot the VM', 'Disable unused services, remove sample applications, close non-essential ports', 'Configure NTP, forward logs to SIEM, tag the asset', 'Run a port scan and document the results'], a: 1, why: 'Hardening = removing/disabling anything not required so there is less to attack.', whyNot: 'Logging/monitoring/tagging improve detection and ops, not attack surface; scanning documents the surface but doesn\'t reduce it.', trap: 'Read the verb: "reduce attack surface" ≠ "improve visibility."' },
    { q: 'During a Linux host investigation you want to check for persistence via scheduled tasks. Which locations do you inspect?', opts: ['/etc/passwd and /etc/shadow', '/etc/crontab and /var/spool/cron', '/var/log/auth.log and ~/.bash_history', '/etc/ssh/sshd_config'], a: 1, why: 'Cron entries in /etc/crontab, /etc/cron.d, and per-user /var/spool/cron are the standard Linux scheduled-task persistence points.', whyNot: 'passwd/shadow are accounts, auth.log/bash_history are activity evidence, sshd_config is service configuration.' },
  ],
  recap: [
    'NTP sync makes timelines possible; out-of-order events = time sync issue',
    'Event IDs: 4624 logon, 4625 failed, 4688 process, 4720 account created',
    'Know normal process parentage (svchost ← services.exe); anomalies = masquerading',
    'Hardening = shrink attack surface; CIS Benchmarks = the standard baseline',
  ],
});

DAYS.push({
  day: 3, domain: 1, icon: '☁️', title: 'Cloud, Virtualization, Containers & Serverless', minutes: 40,
  objectives: [
    'Compare on-premises, cloud, and hybrid network architectures',
    'Explain virtualization, containerization, and serverless — and their security implications',
    'Describe cloud-native monitoring challenges and the shared responsibility model',
  ],
  lesson: [
    { h: 'Deployment models & shared responsibility', blocks: [
      { t: 'table', head: ['Model', 'Traits', 'Security implication'], rows: [
        ['On-premises', 'You own hardware and stack', 'Full control, full responsibility, full cost'],
        ['Cloud', 'Provider hosts infrastructure (AWS/Azure/GCP)', 'Shared responsibility; API-driven; logs come from provider services'],
        ['Hybrid', 'Mix of both, connected', 'Two attack surfaces plus the connection between them; hardest to monitor consistently'],
      ]},
      { t: 'p', x: '**Shared responsibility:** the provider secures the cloud (physical, hypervisor); the customer secures what is *in* the cloud (data, identities, configurations). Most cloud breaches are **customer misconfigurations** — public S3 buckets, over-permissive IAM, exposed keys.' },
      { t: 'exam', x: 'IaaS → you secure OS and up. PaaS → you secure app and data. SaaS → you secure data, access, and configuration. The lower the service level, the more you own.' },
    ]},
    { h: 'Virtualization & containers', blocks: [
      { t: 'p', x: '**Virtualization** runs multiple VMs on one physical host via a hypervisor. Key risks: **VM escape** (breaking from guest to hypervisor — rare but critical), **VM sprawl** (unmanaged VMs nobody patches), and snapshot/image theft.' },
      { t: 'p', x: '**Containers** (Docker/Kubernetes) share the host OS kernel and package apps with their dependencies — lighter and faster than VMs, but a kernel exploit affects every container on the host.' },
      { t: 'list', x: [
        'Container images are built in **layers**; vulnerable base images propagate to everything built on them.',
        'Scan images with **Trivy** (or Grype/Clair) in the CI/CD pipeline *before* deployment — shift-left.',
        'Kubernetes risks: exposed API server/dashboard, over-privileged service accounts, secrets in plain env vars, no network policies between pods.',
        'Container telemetry is ephemeral — a pod that lived 4 minutes is gone; centralised logging is mandatory.',
      ]},
      { t: 'soc', x: 'Alert: crypto-miner process in a container. By the time you look, the pod has been rescheduled and the evidence is gone — unless stdout/stderr and runtime events were shipped to the SIEM. Lesson: log collection must be designed for ephemeral workloads.' },
    ]},
    { h: 'Serverless & cloud-native monitoring', blocks: [
      { t: 'p', x: '**Serverless** (AWS Lambda, Azure Functions) runs code without any server you manage. There is no host to install EDR on — security shifts to **code, dependencies, IAM permissions, and provider logs**.' },
      { t: 'table', head: ['Cloud log source', 'What it gives you'], rows: [
        ['AWS CloudTrail / Azure Activity Log', 'Control-plane API calls: who created/changed/deleted what'],
        ['VPC Flow Logs / NSG Flow Logs', 'Network metadata between cloud resources'],
        ['CloudWatch / Azure Monitor', 'Application and function logs, metrics'],
        ['Cloud audit of identity (IAM/Entra ID sign-in logs)', 'Authentication events, risky sign-ins'],
      ]},
      { t: 'warn', x: 'Attackers love cloud control-plane abuse: stolen access keys → API calls to create resources or exfiltrate data. **CloudTrail is your Security Event Log for the cloud** — an API call from an unusual region/ASN is the cloud version of an odd logon.' },
      { t: 'tip', x: 'Assessment tools: **ScoutSuite** (multi-cloud config audit), **Prowler** (AWS-focused, CIS checks), **Pacu** (AWS exploitation framework — offensive). Know which is which.' },
    ]},
  ],
  flashcards: [
    { f: 'In the shared responsibility model, who secures data and identity configurations in SaaS?', b: 'The customer', exp: 'The provider secures the platform; customers always retain responsibility for their data, access control, and configuration.', tip: 'Data and identities are ALWAYS the customer\'s job, in every service model.' },
    { f: 'What is VM escape?', b: 'An attack breaking out of a guest VM to the hypervisor or host', exp: 'Critical severity because it undermines the isolation every co-tenant VM depends on.', tip: 'Rare but catastrophic — patch hypervisors fast.' },
    { f: 'Key security difference between containers and VMs?', b: 'Containers share the host OS kernel; VMs each have a full OS isolated by a hypervisor', exp: 'Shared kernel = one kernel exploit can compromise all containers on the host. VMs have stronger isolation.', tip: '"Shared kernel" is the phrase CompTIA uses to hint containers.' },
    { f: 'Which open-source tool scans container images for vulnerable packages in CI/CD?', b: 'Trivy', exp: 'Trivy scans images, filesystems, and IaC for known CVEs and misconfigurations before deployment (shift-left).' },
    { f: 'Which AWS log source records control-plane API calls (who did what)?', b: 'AWS CloudTrail', exp: 'CloudTrail is the audit trail of API activity — the primary evidence source for cloud account compromise.', tip: 'Cloud incident? First stop: CloudTrail (or Azure Activity Log).' },
    { f: 'What do ScoutSuite and Prowler do?', b: 'Audit cloud environments for insecure configurations (ScoutSuite = multi-cloud, Prowler = AWS/CIS-focused)', exp: 'Both are cloud infrastructure assessment tools; Pacu, in contrast, is an AWS exploitation/attack framework.', tip: 'ScoutSuite/Prowler = assess. Pacu = attack.' },
    { f: 'Why is EDR not deployable on serverless functions?', b: 'There is no accessible host/OS to install an agent on', exp: 'Serverless security relies on code review, dependency scanning, least-privilege IAM, and provider logs instead.' },
    { f: 'What is VM sprawl?', b: 'Uncontrolled proliferation of VMs that are unmanaged, unpatched, and untracked', exp: 'Sprawled VMs become shadow assets — unknown attack surface outside patch and monitoring coverage.' },
  ],
  quiz: [
    { q: 'A startup runs everything in AWS Lambda. The CISO asks how to add endpoint detection to these workloads. What is the BEST response?', opts: ['Install EDR agents in each function', 'Serverless has no OS access — focus on IAM least privilege, dependency scanning, and CloudTrail/CloudWatch monitoring', 'Migrate everything to EC2 so agents can be installed', 'Serverless is inherently secure and needs no monitoring'], a: 1, why: 'Serverless removes the host layer; controls shift to code, dependencies, permissions, and provider telemetry.', whyNot: 'Agents cannot be installed in Lambda; migrating to VMs for the sake of agents adds cost and surface; "inherently secure" is never true.', trap: 'Any "X is inherently secure" option is wrong.' },
    { sc: 'CloudTrail excerpt:\neventName: CreateAccessKey  user: svc-backup\nsourceIP: 185.220.101.34 (TOR exit)\neventName: PutBucketPolicy  bucket: fin-reports → "Principal":"*"', q: 'What has MOST likely happened?', opts: ['Routine backup job maintenance', 'Compromised credentials being used to create persistence and expose data', 'A misconfigured NTP server', 'CloudTrail log corruption'], a: 1, why: 'A service account creating new access keys (persistence) from a TOR exit node, then making a bucket world-readable (exfil prep), is a classic cloud account compromise chain.', whyNot: 'Backup jobs don\'t originate from TOR or make buckets public; NTP and log corruption don\'t explain the API pattern.', trap: 'Learn this chain: unusual source → CreateAccessKey/CreateUser (persistence) → policy change (exposure) → exfil.' },
    { q: 'Which risk is UNIQUE to containers compared with virtual machines?', opts: ['Malware infection', 'A single host kernel exploit compromising all workloads on that host', 'Phishing of administrators', 'Unpatched applications'], a: 1, why: 'Containers share the host kernel; kernel compromise breaks isolation for every container simultaneously. VMs each have their own kernel behind a hypervisor.', whyNot: 'Malware, phishing, and unpatched apps affect every architecture equally.' },
    { q: 'Security wants container vulnerabilities caught BEFORE images reach production. Where should Trivy scanning be integrated?', opts: ['On developer laptops only', 'In the CI/CD pipeline as a build gate', 'On the SIEM', 'Quarterly, via external pen test'], a: 1, why: 'Scanning as a pipeline gate ("shift-left") blocks vulnerable images from ever deploying, automatically and on every build.', whyNot: 'Laptop-only scanning is unenforced; SIEMs analyse logs, not images; quarterly testing leaves months of exposure.', trap: '"Before production, automatically" → CI/CD pipeline integration.' },
    { q: 'A hybrid enterprise complains that attacks moving between on-prem and cloud are hard to trace. What is the underlying monitoring problem?', opts: ['Cloud logs cannot be exported', 'Telemetry lives in separate silos with inconsistent formats and no unified correlation', 'On-prem firewalls block SIEM traffic', 'Hybrid networks are unmonitorable by design'], a: 1, why: 'Hybrid environments generate different log formats in different places; without central ingestion and normalisation, cross-environment attack paths are invisible.', whyNot: 'Cloud logs export fine (that\'s the fix); firewall blocking would be a config fix, not the systemic issue; "unmonitorable" is defeatist and false.' },
    { q: 'Which tool would an attacker (or red team) use to EXPLOIT a misconfigured AWS environment, rather than just assess it?', opts: ['Prowler', 'ScoutSuite', 'Pacu', 'Trivy'], a: 2, why: 'Pacu is an AWS exploitation framework for post-compromise attack simulation.', whyNot: 'Prowler and ScoutSuite are read-only configuration assessment tools; Trivy scans images/IaC.', trap: 'The exam lists all four as "cloud tools" — the verb (assess vs exploit) picks the answer.' },
  ],
  recap: [
    'Shared responsibility: provider secures the cloud, you secure what\'s IN it — data & identity always yours',
    'Containers share the kernel; scan images with Trivy in CI/CD; log ephemeral workloads centrally',
    'Serverless: no host, no agent — secure code, IAM, dependencies, and watch CloudTrail',
    'ScoutSuite/Prowler assess cloud config; Pacu exploits it',
  ],
});

DAYS.push({
  day: 4, domain: 1, icon: '🕸️', title: 'Network Architecture: Segmentation, Zero Trust, SASE & SDN', minutes: 40,
  objectives: [
    'Explain network segmentation and why it limits lateral movement',
    'Describe zero trust principles and ZTNA',
    'Define SASE and SDN and their roles in modern security architecture',
  ],
  lesson: [
    { h: 'Segmentation: contain the blast radius', blocks: [
      { t: 'p', x: 'Segmentation divides a network into zones (VLANs, subnets, firewalled segments) so a compromise in one zone cannot freely spread. **Microsegmentation** takes this to per-workload granularity, typically enforced in software.' },
      { t: 'flow', x: [{ l: 'Flat network', s: 'one breach = everything reachable' }, { l: 'Segmented', s: 'zones with controlled gateways' }, { l: 'Microsegmented', s: 'per-workload allow-lists' }] },
      { t: 'list', x: [
        'Put crown jewels (databases, OT/ICS, payment systems) in tightly restricted segments.',
        'Segmentation is also a **vulnerability response**: isolate what you cannot patch (legacy/ICS).',
        'East-west (lateral) traffic between segments deserves monitoring, not just north-south internet traffic.',
      ]},
      { t: 'soc', x: 'Ransomware detonates on a marketing laptop. In a flat network it reaches file servers in minutes. With segmentation + monitored east-west traffic, the SOC sees blocked SMB attempts at the zone firewall — an early, high-fidelity signal.' },
    ]},
    { h: 'Zero trust', blocks: [
      { t: 'p', x: 'Zero trust replaces "trusted inside, untrusted outside" with **"never trust, always verify."** Every request is authenticated, authorized, and encrypted regardless of network location.' },
      { t: 'list', x: [
        'Verify **explicitly**: identity + device health + context (location, time, risk) on every access.',
        '**Least privilege**: grant the minimum, just-in-time where possible.',
        '**Assume breach**: design so a compromised element is contained and observable.',
        '**ZTNA** (Zero Trust Network Access) applies this to remote access — per-application access based on identity/posture, replacing broad network-level VPN tunnels.',
      ]},
      { t: 'exam', x: 'VPN vs ZTNA: a VPN puts the user ON the network; ZTNA connects the user to ONE application after verifying identity and device posture. "Replace VPN with per-app, identity-based access" → ZTNA.' },
    ]},
    { h: 'SASE & SDN', blocks: [
      { t: 'p', x: '**SASE (Secure Access Service Edge)** converges networking (SD-WAN) and security services — SWG, CASB, ZTNA, FWaaS — into a single cloud-delivered service. Ideal for distributed workforces: security follows the user, not the office.' },
      { t: 'p', x: '**SDN (Software-Defined Networking)** separates the control plane (decisions) from the data plane (forwarding), managed centrally via APIs. Security upside: programmatic microsegmentation and instant, network-wide policy changes — SOAR can quarantine a subnet with one API call. Risk: the SDN controller becomes a crown-jewel target.' },
      { t: 'table', head: ['Term', 'One-liner for the exam'], rows: [
        ['Segmentation', 'Zones limit lateral movement'],
        ['Zero trust', 'Never trust, always verify — identity + device + context per request'],
        ['ZTNA', 'Per-application remote access; the VPN replacement'],
        ['SASE', 'Cloud-delivered bundle: SD-WAN + SWG + CASB + ZTNA + FWaaS'],
        ['SDN', 'Control plane split from data plane; network managed via API'],
      ]},
    ]},
  ],
  flashcards: [
    { f: 'What attack technique does network segmentation primarily limit?', b: 'Lateral movement', exp: 'Segments with controlled gateways stop an attacker from pivoting freely from an initial foothold to high-value systems.', tip: '"Contain the blast radius" = segmentation.' },
    { f: 'State the three core zero trust principles.', b: 'Verify explicitly, least privilege, assume breach', exp: 'Every access request is evaluated on identity, device posture, and context — network location grants nothing.' },
    { f: 'How does ZTNA differ from a traditional VPN?', b: 'ZTNA grants per-application access after verifying identity/device; VPN grants broad network-level access', exp: 'ZTNA shrinks what a compromised credential can reach from "the network" to "one app."', tip: '"Replace VPN" scenarios → ZTNA.' },
    { f: 'What is SASE?', b: 'Secure Access Service Edge — cloud-delivered convergence of SD-WAN with security services (SWG, CASB, ZTNA, FWaaS)', exp: 'Security is enforced at cloud edge points near users instead of backhauling traffic to a datacenter.', tip: 'Keywords: "distributed workforce", "cloud-delivered", "converged networking + security".' },
    { f: 'In SDN, what is separated from what?', b: 'The control plane (routing decisions) is separated from the data plane (packet forwarding)', exp: 'A central controller programs the network via APIs — enabling automation and microsegmentation, but becoming a high-value target itself.' },
    { f: 'What is microsegmentation?', b: 'Fine-grained, per-workload segmentation typically enforced in software/hypervisor', exp: 'Even two servers on the same subnet can be isolated from each other — key zero trust building block.' },
    { f: 'Traffic between internal systems is called ___; traffic entering/leaving the network is called ___.', b: 'East-west; north-south', exp: 'Attackers move east-west after breach. Monitoring only north-south misses lateral movement.', tip: 'East-west visibility is a common "what\'s missing?" exam answer.' },
  ],
  quiz: [
    { q: 'After a breach post-mortem shows the attacker moved from a phished laptop directly to the database VLAN, which architectural control would BEST prevent recurrence?', opts: ['Stronger email filtering', 'Network segmentation with restricted paths to the database zone', 'Longer password requirements', 'More frequent vulnerability scans'], a: 1, why: 'The failure was unrestricted lateral movement; segmentation restricts which zones can reach the database and on which ports.', whyNot: 'Email filtering addresses initial access but not spread; passwords and scans do not constrain internal pathways.', trap: 'Match the fix to the failure stage described — here it is lateral movement, not initial access.' },
    { q: 'Which scenario BEST illustrates zero trust in action?', opts: ['Users on the corporate LAN access all internal apps without prompts', 'A user\'s access to the payroll app requires MFA and a device compliance check, even from the office', 'The firewall blocks all inbound internet traffic', 'Remote workers connect through a full-tunnel VPN'], a: 1, why: 'Zero trust verifies identity and device posture per request regardless of network location — office presence grants nothing.', whyNot: 'Trusting LAN location is exactly the legacy model; perimeter firewalling and full VPN tunnels are perimeter-trust patterns.', trap: '"Because they\'re on the internal network" = the opposite of zero trust.' },
    { q: 'A global company with 80 small offices and a remote-heavy workforce wants to stop backhauling all traffic to HQ for security inspection. Which architecture directly addresses this?', opts: ['SASE', 'A larger HQ firewall', 'Site-to-site VPNs to every office', 'An on-prem SIEM upgrade'], a: 0, why: 'SASE moves inspection (SWG, CASB, ZTNA, FWaaS) to cloud edge points near users, eliminating backhaul while keeping consistent policy.', whyNot: 'Bigger firewalls and more VPNs still centralise/backhaul traffic; SIEM is visibility, not traffic architecture.', trap: '"Backhaul", "branch offices", "cloud-delivered security" are SASE trigger words.' },
    { sc: 'SOAR playbook step:\nPOST /api/sdn/policies\n{ "action": "isolate", "segment": "vlan-workstations-7" }', q: 'Which technology makes this automated one-call quarantine possible?', opts: ['UEBA', 'Software-defined networking', 'DLP', 'A hardware tap'], a: 1, why: 'SDN\'s API-driven central control plane lets orchestration tools reprogram network policy instantly — quarantining a segment via one API call.', whyNot: 'UEBA detects anomalies, DLP protects data leaving, taps only copy traffic for monitoring.' },
    { q: 'What is the primary NEW risk an organisation accepts when deploying SDN?', opts: ['Slower network throughput', 'The SDN controller becomes a single high-value target controlling the whole network', 'Inability to create VLANs', 'Loss of encryption support'], a: 1, why: 'Compromise of the controller = attacker programs the entire network. It must be hardened, segmented, and monitored as a crown jewel.', whyNot: 'SDN doesn\'t inherently slow forwarding, remove VLAN capability, or affect encryption.' },
    { q: 'The SOC only monitors traffic crossing the internet perimeter. Which attacker activity is MOST likely to be missed?', opts: ['Phishing email delivery', 'Lateral movement between internal servers', 'DDoS attacks', 'Malicious downloads from the web'], a: 1, why: 'Lateral movement is east-west traffic that never crosses the perimeter — invisible without internal sensors/flow logs.', whyNot: 'Phishing, DDoS, and downloads all traverse north-south paths that perimeter monitoring sees.' },
  ],
  recap: [
    'Segmentation/microsegmentation contain lateral movement — monitor east-west, not just north-south',
    'Zero trust: verify explicitly, least privilege, assume breach; ZTNA = per-app VPN replacement',
    'SASE = cloud-delivered SD-WAN + security stack for distributed workforces',
    'SDN = API-programmable network; enables automation, controller becomes crown jewel',
  ],
});

DAYS.push({
  day: 5, domain: 1, icon: '🔐', title: 'IAM, Encryption & Sensitive Data Protection', minutes: 40,
  objectives: [
    'Compare MFA, SSO, federation, PAM, passwordless, and CASB',
    'Explain PKI and SSL/TLS inspection trade-offs',
    'Describe DLP and the handling of PII/CHD',
  ],
  lesson: [
    { h: 'Identity: the new perimeter', blocks: [
      { t: 'table', head: ['Technology', 'What it does', 'Exam cue'], rows: [
        ['MFA', 'Requires 2+ factors (know/have/are)', 'Defeats stolen passwords; watch for MFA fatigue/push-bombing attacks'],
        ['SSO', 'One authentication → many apps (SAML/OIDC)', 'Better UX & fewer passwords; compromised SSO account = keys to everything'],
        ['Federation', 'Trust between identity providers across orgs', 'Partner logs in with THEIR IdP; SAML assertions cross domains'],
        ['PAM', 'Vaults/brokers privileged accounts, session recording, JIT elevation', '"Control and audit admin accounts" → PAM'],
        ['Passwordless', 'FIDO2/passkeys, certs, biometrics', 'Phishing-resistant — nothing to type on a fake page'],
        ['CASB', 'Visibility/policy enforcement between users and cloud apps', '"Shadow IT discovery" and cloud DLP → CASB'],
      ]},
      { t: 'soc', x: 'UEBA flags 40 MFA push denials then one approval at 03:12 for a VP account. That is MFA fatigue: attacker has the password and bombed pushes until the user approved. Response: reset credentials, revoke sessions/tokens, check mailbox rules, switch to number-matching or FIDO2.' },
    ]},
    { h: 'PKI & SSL/TLS inspection', blocks: [
      { t: 'p', x: '**PKI** binds identities to public keys with certificates issued by Certificate Authorities. Analysts meet PKI in TLS everywhere: web, email signing (S/MIME), code signing, device certs.' },
      { t: 'p', x: '**SSL/TLS inspection**: because most malware C2 and exfiltration hide in encrypted traffic, inspection devices act as a controlled man-in-the-middle — decrypt, inspect, re-encrypt with an internal CA cert trusted by managed devices.' },
      { t: 'list', x: [
        'Benefits: visibility into encrypted C2, phishing payloads, data exfiltration.',
        'Costs: privacy concerns (exempt banking/health categories), performance overhead, certificate-pinned apps break.',
        'Without inspection, rely on **metadata**: JA3/JA3S fingerprints, SNI, certificate anomalies, traffic timing (beaconing).',
      ]},
      { t: 'exam', x: 'Scenario says "IDS cannot see the payload because traffic is encrypted" → answer involves SSL/TLS inspection (or metadata analysis if inspection is ruled out).' },
    ]},
    { h: 'Sensitive data: DLP, PII, CHD', blocks: [
      { t: 'p', x: '**DLP** discovers, classifies, and controls sensitive data in motion (network/email), at rest (storage), and in use (endpoint). Policies match patterns (card numbers, national IDs), keywords, or labels, then block/quarantine/alert.' },
      { t: 'list', x: [
        '**PII** — data identifying a person (name+DOB, SSN, biometrics). Regulated by GDPR and similar laws.',
        '**CHD (cardholder data)** — PAN, names, expiry, service codes. Governed by **PCI DSS**: scope minimisation, encryption, segmentation of the cardholder data environment (CDE).',
        'DLP is a common **compensating** and **detective/preventive** control in exam answers about exfiltration and email mistakes.',
      ]},
      { t: 'soc', x: 'DLP alert: employee emailed a spreadsheet with 3,400 card numbers to a personal Gmail. Tier 2 tasks: confirm true positive (real PANs, Luhn-valid?), quarantine the message, notify security management — this may trigger PCI DSS incident obligations, so document from the start.' },
    ]},
  ],
  flashcards: [
    { f: 'An attacker with a valid password sends dozens of MFA push notifications until the user approves. What is this attack?', b: 'MFA fatigue (push bombing)', exp: 'Mitigations: number matching, limiting prompts, or phishing-resistant FIDO2/passkeys.', tip: 'New CS0-004 favourite — know the mitigation, not just the name.' },
    { f: 'Which tool gives visibility and policy control over sanctioned and shadow cloud app usage?', b: 'CASB (Cloud Access Security Broker)', exp: 'CASBs sit between users and cloud services for discovery, DLP, and access policy.', tip: '"Employees using unapproved SaaS" → CASB.' },
    { f: 'What does PAM provide beyond regular IAM?', b: 'Vaulting, brokering, just-in-time elevation, and session recording for privileged accounts', exp: 'Admin credentials are checked out, used through a controlled session, and rotated — reducing standing privilege.', tip: '"Record what admins do" / "check out admin credentials" → PAM.' },
    { f: 'Why is FIDO2/passkey authentication called phishing-resistant?', b: 'The credential is bound to the legitimate site origin and never typed, so a fake page cannot capture or replay it', exp: 'Cryptographic challenge-response with origin binding defeats credential-harvesting pages and MFA relay kits.' },
    { f: 'What trade-offs come with SSL/TLS inspection?', b: 'Privacy concerns, performance cost, and breakage of certificate-pinned applications', exp: 'Organisations exempt sensitive categories (health, banking) and must protect the inspection CA key rigorously.' },
    { f: 'Traffic is encrypted and cannot be decrypted. Name two ways to still detect C2.', b: 'TLS metadata analysis (JA3 fingerprints, SNI, certificate anomalies) and traffic pattern analysis (beaconing intervals, byte counts)', exp: 'Encrypted traffic still leaks behavioural metadata that detection can key on.', tip: 'Regular-interval connections = beaconing, encrypted or not.' },
    { f: 'Which standard governs storage and transmission of cardholder data?', b: 'PCI DSS', exp: 'Requires encryption of CHD, network segmentation of the CDE, scans, and strict access control.', tip: 'Card data scenario → PCI DSS, always.' },
    { f: 'What are the three states of data a DLP program covers?', b: 'In motion (network/email), at rest (storage), in use (endpoint)', exp: 'Full DLP coverage requires sensors at all three: gateway, storage scanning, and endpoint agents.' },
  ],
  quiz: [
    { sc: 'SIEM (identity provider logs):\n03:07-03:11  user=vp-finance  MFA_PUSH_DENIED ×23\n03:12        user=vp-finance  MFA_PUSH_APPROVED\n03:13        new mailbox rule: "delete from:security@"', q: 'What happened and what is the FIRST response action?', opts: ['User forgot their phone; no action', 'MFA fatigue attack succeeded; revoke sessions and reset credentials immediately', 'SSO outage; open an IT ticket', 'Normal international travel; whitelist the IP'], a: 1, why: 'Mass denials followed by approval plus an evidence-hiding mailbox rule = successful push bombing. Kill sessions/tokens and reset credentials before further abuse.', whyNot: 'Forgotten phones don\'t create mailbox rules; nothing indicates outage or travel.', trap: 'The mailbox rule deleting security emails is the tell — attackers hide alerts from victims.' },
    { q: 'A hospital must let partner-clinic physicians access its portal using the clinics\' own corporate logins. Which capability enables this?', opts: ['PAM', 'Federation', 'CASB', 'DLP'], a: 1, why: 'Federation establishes trust between separate identity providers, letting external users authenticate with their home organisation\'s credentials (e.g., SAML).', whyNot: 'PAM manages privileged accounts; CASB governs cloud app usage; DLP protects data content.', trap: '"Users from ANOTHER organisation using THEIR OWN credentials" = federation, not SSO (SSO is within one identity ecosystem).' },
    { q: 'Security discovers marketing has been using an unapproved file-sharing SaaS for client data. Which control provides ongoing discovery and policy enforcement for this problem class?', opts: ['EDR', 'CASB', 'NAC', 'WAF'], a: 1, why: 'Shadow IT discovery plus cloud-app policy (block/allow, DLP on uploads) is exactly the CASB use case.', whyNot: 'EDR is endpoint threats; NAC gates network admission by device posture; WAF protects your own web apps.' },
    { q: 'An IDS shows a workstation making outbound HTTPS connections every 60 seconds to the same IP, ~200 bytes each. Payload inspection is impossible. What is the MOST reasonable assessment?', opts: ['Normal web browsing', 'Software update checks — ignore', 'Likely C2 beaconing based on timing regularity and uniform size', 'DNS misconfiguration'], a: 2, why: 'Machine-regular intervals with uniform small payloads are the beaconing signature; encryption hides content, not behaviour.', whyNot: 'Human browsing is bursty and irregular; update checks are typically daily, not per-minute (and verifiable by destination); DNS issues don\'t create rhythmic HTTPS.', trap: 'Beaconing questions are about TIMING and SIZE patterns, never payload.' },
    { q: 'A DLP email policy blocks a message containing 3,400 strings matching credit card formats. Which validation step confirms this is a true positive?', opts: ['Ask the sender if the data is real', 'Check whether the numbers pass Luhn validation and match real card BIN ranges', 'Release the email and monitor', 'Assume DLP is always correct'], a: 1, why: 'Luhn checksum plus BIN analysis distinguishes real PANs from test data or random numbers — analyst validation before escalation.', whyNot: 'Senders may lie or not know; releasing possible CHD violates PCI DSS; DLP regexes routinely false-positive on order numbers and test data.' },
    { q: 'Which change moves an organisation furthest toward phishing-resistant authentication?', opts: ['SMS one-time codes for all users', 'Longer password rotation intervals', 'FIDO2 security keys / passkeys', 'Security questions plus password'], a: 2, why: 'FIDO2 binds authentication to the legitimate origin cryptographically; there is nothing for a phishing page to steal or relay.', whyNot: 'SMS codes are phishable and SIM-swappable; rotation policies don\'t affect phishing; security questions are weak knowledge factors.', trap: 'SMS OTP is MFA but NOT phishing-resistant — the exam distinguishes these.' },
  ],
  recap: [
    'MFA fatigue: mass push denials → approval; fix with number matching or FIDO2',
    'Federation = cross-org IdP trust; PAM = vault/record privileged access; CASB = shadow IT + cloud DLP',
    'TLS inspection buys visibility at privacy/performance cost; without it, hunt with metadata (JA3, SNI, beacon timing)',
    'DLP covers data in motion/at rest/in use; card data = PCI DSS territory',
  ],
});
