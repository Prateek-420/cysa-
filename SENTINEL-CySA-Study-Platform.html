/* ============ Days 6-10: Indicators, tools, SIEM, email/file analysis (Domain 1) ============ */
'use strict';

DAYS.push({
  day: 6, domain: 1, icon: '📡', title: 'Network Indicators of Malicious Activity', minutes: 40,
  objectives: [
    'Recognise network IOCs: beaconing, bandwidth anomalies, scans/sweeps, rogue devices, P2P, unexpected ports',
    'Interpret traffic patterns to distinguish C2, exfiltration, and DoS',
    'Explain DNS-based attack indicators (tunnelling, DGA, fast flux)',
  ],
  lesson: [
    { h: 'The big network IOCs', blocks: [
      { t: 'table', head: ['Indicator', 'What it looks like', 'Likely meaning'], rows: [
        ['Beaconing', 'Regular-interval, uniform-size connections to one destination', 'C2 heartbeat (jitter may be added to evade)'],
        ['Bandwidth spike', 'Large outbound volume, odd hours, to unfamiliar destination', 'Data exfiltration (or backup — verify destination!)'],
        ['Scans/sweeps', 'One source touching many ports (scan) or many hosts on one port (sweep)', 'Reconnaissance / worm propagation'],
        ['Irregular P2P', 'Host-to-host traffic between workstations', 'Lateral movement or P2P malware — workstations rarely need to talk to each other'],
        ['Rogue device', 'Unknown MAC/DHCP lease, unauthorized AP', 'Attacker foothold or shadow IT'],
        ['Unexpected ports', 'Known service on wrong port (e.g., SSH on 8443), or traffic mismatching the port\'s protocol', 'Evasion / tunnelling'],
      ]},
      { t: 'tip', x: 'Always compare against a **baseline**. "Is 40 GB outbound unusual?" depends entirely on what that host normally does. No baseline = no anomaly detection.' },
    ]},
    { h: 'DNS: the covert channel workhorse', blocks: [
      { t: 'list', x: [
        '**DNS tunnelling** — data smuggled in queries/responses: very long, high-entropy subdomains, huge query volume to one domain, TXT-record abuse.',
        '**DGA (domain generation algorithm)** — malware computes hundreds of random-looking domains daily (`kq3vz9x2.info`); most NXDOMAIN, one resolves to live C2. Indicator: high NXDOMAIN rate from one host.',
        '**Fast flux** — one domain resolving to constantly rotating IPs (short TTLs) to hide C2 infrastructure.',
      ]},
      { t: 'code', x: 'Suspicious DNS pattern:\n  aGVsbG8gd29ybGQ.badcdn.xyz   TXT ?\n  c2VjcmV0ZGF0YQ.badcdn.xyz    TXT ?\n  ... (1,900 queries/hour, avg subdomain length 42 chars)\n→ high entropy + volume + TXT = DNS tunnelling' },
      { t: 'soc', x: 'Your SIEM shows a host generating 3,000 DNS queries/hour with an 85% NXDOMAIN rate. Web proxy shows almost no matching HTTP. Assessment: DGA malware hunting for its C2 domain. Action: isolate, capture memory, find the process making the queries.' },
    ]},
    { h: 'Reading the pattern, not the packet', blocks: [
      { t: 'p', x: 'Tier 2 pattern-recognition cheatsheet:' },
      { t: 'table', head: ['Pattern', 'Interpretation'], rows: [
        ['Many SYNs, no completed handshakes', 'SYN scan or SYN flood (volume decides)'],
        ['Sequential dest ports from one source', 'Port scan (e.g., Nmap)'],
        ['Same port across sequential IPs', 'Host sweep — worm or recon'],
        ['Outbound 443 with regular timing + fixed size', 'Encrypted C2 beacon'],
        ['Large transfer to personal-cloud/newly-registered domain', 'Exfiltration channel'],
        ['Traffic on TCP/4444, 1337, 31337', 'Classic malware/Metasploit defaults — instant red flag'],
      ]},
      { t: 'exam', x: 'Scan vs sweep: **scan = many ports, one host**; **sweep = one port, many hosts**. CompTIA tests this exact wording.' },
    ]},
  ],
  flashcards: [
    { f: 'Connections every 300 seconds to the same external IP, each ~180 bytes. What is this pattern called?', b: 'Beaconing (C2 heartbeat)', exp: 'Malware checks in with its command-and-control server on a timer; jitter may vary the interval slightly to evade detection.', tip: 'Regular timing + uniform size = beacon, even when encrypted.' },
    { f: 'One source IP probing ports 1–1024 on a single server is a ___; probing port 445 across an entire subnet is a ___.', b: 'Port scan; host sweep', exp: 'Scan enumerates services on one target; sweep finds hosts running one service across many targets.', tip: 'Exam wording is literal: scan=ports, sweep=hosts.' },
    { f: 'A host shows a very high NXDOMAIN (failed DNS) rate for random-looking domains. What malware technique is this?', b: 'Domain generation algorithm (DGA)', exp: 'The malware brute-forces algorithmically generated domains until one resolves to the live C2 server.' },
    { f: 'What are the key indicators of DNS tunnelling?', b: 'Long/high-entropy subdomains, unusually high query volume to one domain, heavy TXT record use', exp: 'Data is encoded into DNS queries/responses to bypass firewalls that allow DNS out.', tip: 'DNS allowed everywhere = favourite exfil channel.' },
    { f: 'Why is workstation-to-workstation traffic inherently suspicious?', b: 'Workstations normally talk to servers, not to each other — P2P patterns suggest lateral movement or worm activity', exp: 'Irregular peer-to-peer communication is a named CySA+ network IOC.' },
    { f: 'A single domain resolves to a different IP every few minutes with very short TTLs. What is this?', b: 'Fast flux', exp: 'Botnets rotate compromised hosts behind one domain to make C2 takedown and blocking difficult.' },
    { f: 'Massive outbound transfer at 02:00 to an unfamiliar cloud storage domain — first hypothesis?', b: 'Data exfiltration', exp: 'Validate against baseline and change tickets (could be legitimate backup), then inspect destination reputation and what data left.', tip: 'Verify before declaring: backups also run at 2 a.m.' },
    { f: 'Traffic to TCP port 4444 raises suspicion because…', b: 'It is the default Metasploit handler port', exp: 'Defaults like 4444, 1337, 31337 are classic attacker-tool signatures worth immediate investigation.' },
  ],
  quiz: [
    { sc: 'NetFlow summary for WS-2214 (last hour):\n→ 52.94.x.x  :443  48 conns, every 60s ±2s, 210±6 bytes each\n→ various    :443  22 conns, irregular, 2–840 KB', q: 'Which flow set is MOST consistent with C2 beaconing?', opts: ['The irregular flows — variety means evasion', 'The 60-second regular flows with uniform size', 'Both equally', 'Neither — port 443 is always legitimate'], a: 1, why: 'Machine-precise intervals with near-constant payload size are the C2 heartbeat signature. Human/software browsing (the second set) is bursty and variable.', whyNot: 'Irregular, size-varied flows match normal web use; port 443 being common is exactly why malware uses it.', trap: '"It\'s on 443 so it\'s fine" is a trap — attackers deliberately blend into allowed ports.' },
    { q: 'A SIEM alerts that one internal IP contacted port 445 on 254 sequential internal addresses in 90 seconds. What is this activity?', opts: ['Port scan', 'Host sweep — possible worm or lateral movement recon', 'DNS tunnelling', 'Beaconing'], a: 1, why: 'One port across many hosts = sweep; SMB (445) sweeping is characteristic of worms (e.g., WannaCry-style propagation) and lateral movement recon.', whyNot: 'A port scan would hit many ports on few hosts; no DNS or timing-regularity evidence here.', trap: 'Port 445 + internal sweep should also make you think "ransomware spreading" in IR questions.' },
    { sc: 'DNS logs, host LT-088:\n02:00-03:00: 2,847 queries\n85% NXDOMAIN\nsample: xk2v9qm.net, p0osz1w.net, m3nb7ax.net', q: 'What should the analyst conclude?', opts: ['User is browsing heavily', 'Likely DGA malware seeking its C2 domain', 'DNS server misconfiguration', 'Normal CDN behaviour'], a: 1, why: 'High-volume queries for random-string domains with a huge NXDOMAIN rate is the textbook DGA signature.', whyNot: 'Browsing resolves real domains; a resolver misconfig affects many hosts, not one; CDNs use resolvable, structured names.', trap: 'One host + NXDOMAIN storm = DGA. Many hosts + NXDOMAIN = infra problem.' },
    { q: 'Which of the following is the BEST reason unauthorized rogue devices are a serious network IOC?', opts: ['They consume IP addresses', 'They provide an unmanaged, unmonitored foothold inside the trusted network', 'They slow down the DHCP server', 'They violate asset tags policy'], a: 1, why: 'A rogue device bypasses endpoint controls entirely — no EDR, no patching, unknown owner — inside the perimeter.', whyNot: 'IP/DHCP consumption and tagging are administrative trivia, not the security impact.' },
    { q: 'An analyst sees outbound SSH traffic leaving on TCP port 53. Why is this suspicious?', opts: ['SSH is always malicious', 'Port 53 is reserved and cannot carry TCP', 'Protocol-port mismatch suggests tunnelling to evade egress filtering', 'SSH should use UDP'], a: 2, why: 'Wrapping SSH in the DNS port abuses the fact that 53 is almost always allowed outbound — classic evasion/tunnelling.', whyNot: 'SSH is a legitimate protocol; DNS legitimately uses TCP 53 for large transfers; SSH is TCP-based.', trap: '"Activity on unexpected ports" = the mismatch between the protocol observed and the port\'s expected service.' },
    { q: 'To detect bandwidth-consumption anomalies reliably, what must the SOC have FIRST?', opts: ['An IPS', 'A traffic baseline of normal per-host behaviour', 'SSL inspection', 'A honeypot'], a: 1, why: 'Anomaly detection is deviation from normal; without a baseline there is no "abnormal."', whyNot: 'IPS blocks known signatures; SSL inspection reveals content, not volume anomalies; honeypots detect interaction, not volume.' },
  ],
  recap: [
    'Beacon = regular timing + uniform size; jitter blurs but rarely hides it',
    'Scan = many ports/one host; sweep = one port/many hosts',
    'DNS: tunnelling (entropy+volume), DGA (NXDOMAIN storm), fast flux (rotating IPs)',
    'Baselines make anomalies detectable; protocol-port mismatch = tunnelling',
  ],
});

DAYS.push({
  day: 7, domain: 1, icon: '💻', title: 'Host & Application Indicators', minutes: 40,
  objectives: [
    'Recognise host IOCs: resource consumption, malicious processes, unauthorized changes/privileges, persistence',
    'Recognise application IOCs: anomalous activity, new accounts, unexpected output/communication',
    'Spot social engineering and obfuscated link indicators',
  ],
  lesson: [
    { h: 'Host-based IOCs', blocks: [
      { t: 'table', head: ['Indicator', 'Example', 'Common cause'], rows: [
        ['CPU/memory spike', 'Sustained 95% CPU on idle workstation', 'Cryptominer, scanning malware'],
        ['Drive capacity jump', 'Disk filling with unknown archives', 'Data staging before exfiltration'],
        ['Unauthorized software', 'Remote admin tool (AnyDesk) appears', 'Attacker persistence / insider'],
        ['Malicious process', 'Masquerading names, wrong paths, unsigned binaries', 'Active malware'],
        ['Unauthorized change', 'Config/GPO/registry altered outside change control', 'Attacker weakening defences'],
        ['Unauthorized privilege', 'User suddenly in local admins/Domain Admins', 'Privilege escalation'],
        ['Scheduled task', 'New task running PowerShell from %TEMP%', 'Persistence'],
        ['File system anomaly', 'Mass renames + new TXT in every folder', 'Ransomware encrypting + notes'],
      ]},
      { t: 'soc', x: 'Data staging pattern to memorise: attacker gathers files → compresses to archive (`finance_q3.rar` in C:\\Windows\\Temp) → exfiltrates. A big archive in a temp/system directory is a five-alarm indicator that exfil is imminent or done.' },
      { t: 'exam', x: 'Abnormal OS process behaviour: right name, wrong **path**, wrong **parent**, or unexpected **network connections** (why is notepad.exe talking to the internet?).' },
    ]},
    { h: 'Application-level IOCs', blocks: [
      { t: 'list', x: [
        '**Anomalous activity** — app behaving outside its function (web server launching cmd.exe = webshell).',
        '**Introduction of new accounts** — especially privileged app/service accounts nobody requested.',
        '**Unexpected output** — SQL errors leaking schema (injection attempts), defaced pages, weird responses.',
        '**Unexpected outbound communication** — internal database posting to an external IP.',
        '**Service interruption** — crashes can be exploitation side effects, not just ops issues.',
        '**Application logs** — auth failures, input validation errors, and 500-series spikes tell the story.',
      ]},
      { t: 'code', x: 'IIS log excerpt:\nGET /product.aspx?id=1\' OR 1=1--        500\nGET /product.aspx?id=1 UNION SELECT...   500 ×40\nGET /uploads/img.aspx                    200\nPOST /uploads/img.aspx cmd=whoami        200\n→ SQLi probing, then webshell upload & use' },
      { t: 'warn', x: 'A web server process (w3wp.exe, apache) spawning a shell (cmd.exe, /bin/bash) is one of the highest-confidence compromise signals that exists. Treat as incident, not alert.' },
    ]},
    { h: 'Social engineering & obfuscated links', blocks: [
      { t: 'list', x: [
        'Urgency + authority + unusual request = social engineering trifecta (CEO fraud/BEC).',
        'Obfuscated links: lookalike domains (`rn` for `m`), URL shorteners, open redirects, punycode (`xn--`), HTML anchor text differing from href, excessive subdomains (`paypal.com.secure-login.evil.tld`).',
        'Hover (or decode) before you judge; the **rightmost registered domain** is what counts.',
      ]},
      { t: 'tip', x: 'Read URLs right to left: in `paypal.com.verify-account.ru`, the real domain is `verify-account.ru` — everything before it is subdomain decoration.' },
    ]},
  ],
  flashcards: [
    { f: 'A large RAR archive appears in C:\\Windows\\Temp on a file server. What attack phase does this indicate?', b: 'Data staging (collection) — precursor to exfiltration', exp: 'Attackers compress and stage stolen data locally before transferring it out. Finding staged archives means exfil is imminent or already done.', tip: 'Archive + temp/system directory = staging. High-priority indicator.' },
    { f: 'w3wp.exe (IIS) spawns cmd.exe. What does this indicate?', b: 'Webshell / web application compromise — the web server is executing attacker commands', exp: 'Web server processes have no legitimate reason to launch shells; this is a high-confidence IOC.', tip: 'Web process → shell process = incident, escalate immediately.' },
    { f: 'Sustained maximum CPU on many idle machines, with connections to a mining pool. Diagnosis?', b: 'Cryptojacking (cryptominer infection)', exp: 'Processor consumption is the named host IOC; miners monetise stolen compute.' },
    { f: 'Every document folder gains a new .txt file and thousands of files get new extensions. What is happening?', b: 'Ransomware encryption in progress (file system changes/anomalies + ransom notes)', exp: 'Mass file modification plus dropped notes is the live-encryption signature — immediate isolation required.', tip: 'This is a "contain FIRST" scenario — damage is actively spreading.' },
    { f: 'In URL analysis, which part of `login.microsoft.com.token-check.io` actually determines the destination owner?', b: 'token-check.io (the registered domain, read right-to-left)', exp: 'Everything left of the registered domain is attacker-controlled subdomain text designed to look trustworthy.' },
    { f: 'What is punycode abuse in phishing?', b: 'Using internationalised characters that render like Latin letters (xn-- domains) to imitate legitimate domains', exp: 'e.g., Cyrillic "а" in "аpple.com" — visually identical, different domain.', tip: 'Seeing `xn--` in logs = punycode; decode before judging.' },
    { f: 'A service account appears in Domain Admins with no change ticket. Which IOC category is this?', b: 'Unauthorized privileges (privilege escalation indicator)', exp: 'Group membership changes outside change control are prime persistence/escalation evidence — check who made the change and when.' },
    { f: 'Why can an application crash be a security signal rather than an ops issue?', b: 'Failed exploitation attempts (e.g., buffer overflows) often crash the target service', exp: 'Repeated crashes of an internet-facing service deserve correlation with attack traffic before being dismissed.' },
  ],
  quiz: [
    { sc: 'EDR timeline, host FS-01 (file server):\n01:14 7zip.exe creates C:\\Windows\\Temp\\hr_all.7z (2.3 GB)\n01:22 curl.exe POST https://transfer.sh  2.3 GB sent', q: 'What activity sequence does this show?', opts: ['Routine backup to cloud', 'Data staging followed by exfiltration', 'Software update download', 'Disk cleanup'], a: 1, why: 'Compressing sensitive data into a temp-directory archive (staging) then pushing it to an anonymous file-sharing service is the classic exfil chain.', whyNot: 'Backups use sanctioned agents/destinations, not curl to transfer.sh; downloads are inbound; cleanup deletes rather than uploads.', trap: 'transfer.sh / anonfiles-style destinations in questions = exfiltration, not backup.' },
    { q: 'Which process observation is MOST suspicious?', opts: ['Twelve svchost.exe instances, all children of services.exe', 'chrome.exe using 1.5 GB RAM', 'notepad.exe with an established connection to an external IP on port 443', 'explorer.exe running as the logged-in user'], a: 2, why: 'Notepad has no network functionality; a socket from it means code injection or masquerading.', whyNot: 'Multiple svchost children of services.exe, hungry browsers, and user-context explorer are all normal.', trap: '"Unexpected outbound communication" from a no-network binary is a named IOC.' },
    { sc: 'Web app log:\n09:31 GET /search?q=test          200\n09:32 GET /search?q=\' OR \'1\'=\'1  500 (ODBC error: syntax near...)\n09:33-09:41 similar ×57', q: 'What do the 500 responses with database error text indicate?', opts: ['Server needs more RAM', 'SQL injection probing — and the app is leaking error details that help the attacker', 'Normal load testing', 'Expired TLS certificate'], a: 1, why: 'Quote-based payloads triggering verbose database errors show injection attempts AND an information-disclosure weakness (unexpected output).', whyNot: 'Resource, load-test, and certificate issues don\'t produce SQL syntax errors tied to crafted input.', trap: 'Verbose error messages are themselves a finding: they confirm to attackers that injection is parsing.' },
    { q: 'A help desk reports a user\'s machine has AnyDesk installed, but the software inventory and change records show no approval. Why does this matter to the SOC?', opts: ['License compliance risk only', 'Unauthorized remote access software is a common attacker persistence mechanism', 'AnyDesk is malware', 'It consumes bandwidth'], a: 1, why: 'Attackers (and rogue insiders) install legitimate remote-admin tools to maintain access that blends in — "unauthorized software" is a named host IOC.', whyNot: 'AnyDesk itself is a legitimate product; licensing/bandwidth miss the security significance.', trap: 'Legitimate tool + unauthorized presence = still an IOC. Judge by authorization, not by the binary\'s reputation.' },
    { q: 'An email from the "CEO" demands an urgent wire transfer and instructs the recipient not to tell anyone. Which two social-engineering levers are being pulled?', opts: ['Scarcity and reciprocity', 'Urgency and authority', 'Familiarity and consensus', 'Fear and curiosity'], a: 1, why: 'Time pressure (urgent) plus impersonated power (CEO) — with secrecy to block verification — is textbook BEC.', whyNot: 'No limited-supply, favour-trading, peer-pressure, or curiosity elements are described.' },
    { q: 'Which URL is MOST likely a phishing link?', opts: ['https://accounts.google.com/signin', 'https://www.microsoft.com/en-us/security', 'https://secure-login.paypal.com.account-verify.info/session', 'https://github.com/login'], a: 2, why: 'The registered domain is account-verify.info; "paypal.com" appears only as subdomain bait.', whyNot: 'The others terminate at their genuine registered domains.', trap: 'Read right-to-left to the registered domain. Brand names on the LEFT of the domain are decoration.' },
  ],
  recap: [
    'Archive in temp dir = staging; staging → exfil chain is exam gold',
    'Judge processes by path, parent, signature, and network behaviour — not just name',
    'Web process spawning a shell = incident; verbose SQL errors = injection + info leak',
    'Read URLs right-to-left; authorization defines "unauthorized," not the tool\'s reputation',
  ],
});

DAYS.push({
  day: 8, domain: 1, icon: '🔬', title: 'Packet Capture & Network Detection Tools', minutes: 40,
  objectives: [
    'Use Wireshark and tcpdump concepts: filters, follow stream, when to capture',
    'Compare IDS/IPS engines (Snort, Suricata) with the network analysis framework Zeek',
    'Choose the right network tool for a given investigation task',
  ],
  lesson: [
    { h: 'Packet capture: Wireshark & tcpdump', blocks: [
      { t: 'p', x: '**tcpdump** = CLI capture (servers, quick filters, save to .pcap). **Wireshark** = GUI deep analysis (protocol dissection, Follow TCP Stream, statistics, export objects).' },
      { t: 'code', x: '# capture port 53 traffic on eth0 to file\ntcpdump -i eth0 -w dns.pcap port 53\n# read + filter by host\ntcpdump -r dns.pcap host 10.1.2.3\n\nWireshark display filters:\n  http.request.method == "POST"\n  ip.addr == 10.1.2.3 && tcp.port == 443\n  dns.qry.name contains "badcdn"' },
      { t: 'list', x: [
        '**Capture filter** (BPF, at capture time) vs **display filter** (after capture) — different syntaxes, know which is which.',
        '**Follow TCP Stream** reassembles a full conversation — reading cleartext credentials, HTTP sessions, or C2 commands.',
        'PCAPs are full-fidelity evidence but heavy: capture selectively, hash files for chain of custody.',
      ]},
    ]},
    { h: 'IDS/IPS: Snort & Suricata', blocks: [
      { t: 'p', x: 'Signature-based network detection. **IDS** (passive tap/SPAN — detect only) vs **IPS** (inline — can block). **Snort** is the classic engine; **Suricata** is the modern multi-threaded alternative with native file extraction and JSON (EVE) output.' },
      { t: 'code', x: 'alert tcp $EXTERNAL_NET any -> $HOME_NET 3389 \\\n  (msg:"RDP brute force attempt"; flow:to_server; \\\n   threshold:type both, track by_src, count 20, seconds 60; sid:1000042;)' },
      { t: 'list', x: [
        'Signatures catch **known** patterns; anomaly/behavioural analysis is needed for novel threats.',
        'Inline IPS risk: a false positive **blocks legitimate traffic** — tuning matters more when you can do harm.',
        'Encrypted traffic blinds payload signatures → pair with TLS inspection or metadata analytics.',
      ]},
    ]},
    { h: 'Zeek: the network flight recorder', blocks: [
      { t: 'p', x: '**Zeek** (formerly Bro) is not signature IDS — it converts raw traffic into rich structured **logs**: conn.log (every connection), dns.log, http.log, ssl.log, files.log, notice.log. Perfect for hunting and retrospective investigation.' },
      { t: 'table', head: ['Task', 'Best tool'], rows: [
        ['Block known exploit patterns inline', 'Suricata/Snort as IPS'],
        ['Deep-dive one suspicious conversation', 'Wireshark (Follow Stream)'],
        ['Quick server-side capture over SSH', 'tcpdump'],
        ['Hunt across weeks of network metadata', 'Zeek logs in the SIEM'],
        ['Fingerprint TLS clients without decryption', 'Zeek ssl.log / JA3'],
      ]},
      { t: 'soc', x: 'Threat intel drops a C2 IP that was active "sometime last month." Full PCAP for a month is impossible to store, but Zeek conn.log covers every connection for 90 days. One query later: three hosts contacted the IP. That is why "flight recorder" metadata beats full capture for retro-hunting.' },
      { t: 'exam', x: 'Choose by task verb: **block** → IPS; **inspect one conversation deeply** → Wireshark; **search historical connections at scale** → Zeek/flow logs; **alert on a known signature** → Snort/Suricata.' },
    ]},
  ],
  flashcards: [
    { f: 'Which tool would you use to reassemble and read a full TCP conversation from a capture?', b: 'Wireshark — Follow TCP Stream', exp: 'Stream following rebuilds both directions of a session, exposing cleartext credentials, commands, or transferred content.' },
    { f: 'Key operational difference between IDS and IPS?', b: 'IDS is passive (detects/alerts, off a tap or SPAN); IPS is inline (can block)', exp: 'Inline placement gives IPS blocking power but makes false positives service-affecting.', tip: 'FP on IDS = noise; FP on IPS = outage.' },
    { f: 'What is Zeek and how does it differ from Snort?', b: 'A network analysis framework producing structured logs (conn, dns, http, ssl) rather than signature alerts', exp: 'Zeek records what happened on the network for hunting and retrospection; Snort/Suricata match attack signatures in real time.', tip: '"Historical network metadata search" → Zeek.' },
    { f: 'tcpdump command element: what does `-w file.pcap` do?', b: 'Writes raw captured packets to a file for later analysis', exp: 'Capture on the server with tcpdump, analyse in Wireshark — the standard workflow.' },
    { f: 'Capture filter vs display filter in Wireshark?', b: 'Capture filters (BPF syntax) limit what is recorded; display filters refine what is shown afterwards', exp: 'You cannot recover traffic a capture filter excluded — display filters are non-destructive.' },
    { f: 'What advantages does Suricata have over classic Snort?', b: 'Multi-threaded performance, native file extraction, JSON (EVE) output, protocol parsers', exp: 'Both use compatible rule syntax; Suricata scales better on modern hardware and integrates smoothly with SIEMs.' },
    { f: 'Which Zeek log records every network connection with bytes, duration, and endpoints?', b: 'conn.log', exp: 'conn.log is the flight-recorder backbone — beaconing detection and retro-hunts start here.' },
    { f: 'What is a JA3 fingerprint?', b: 'A hash of TLS client handshake parameters used to identify client software without decryption', exp: 'Malware families often present distinctive JA3 values, enabling encrypted-C2 detection via metadata.', tip: 'Detecting malware in TLS without decrypting → JA3.' },
  ],
  quiz: [
    { q: 'An analyst must examine exactly what commands an attacker typed over an unencrypted reverse shell captured in a PCAP. Which technique is BEST?', opts: ['Run the PCAP through Snort', 'Open in Wireshark and Follow TCP Stream', 'Grep the raw file', 'Convert to NetFlow'], a: 1, why: 'Follow TCP Stream reassembles the session in order, showing the interactive commands and responses readably.', whyNot: 'Snort would only fire signatures; grep on raw binary misses reassembly/ordering; NetFlow discards payloads entirely.' },
    { q: 'The SOC needs to answer "which hosts talked to 203.0.113.50 in the past 60 days?" Full packet capture is only retained for 3 days. What makes this answerable?', opts: ['Wireshark', 'Long-retention Zeek conn.log / flow records', 'An IPS rule added today', 'Antivirus logs'], a: 1, why: 'Connection metadata is compact enough for long retention; Zeek/NetFlow records answer historical who-talked-to-whom questions.', whyNot: 'Wireshark needs the (expired) PCAPs; a new IPS rule only sees future traffic; AV logs don\'t track network flows.', trap: 'Retro-hunting questions hinge on what data was being RETAINED before you asked.' },
    { sc: 'Suricata alert:\nSID 2019401 "ET EXPLOIT SMB EternalBlue" \nsrc 10.8.3.44 → dst 10.8.3.0/24 multiple\nMode: IDS (SPAN port)', q: 'What is an important limitation of this deployment the analyst must remember?', opts: ['Suricata cannot parse SMB', 'The sensor only detects — nothing was blocked; the exploit attempts reached targets', 'SPAN ports double traffic volume', 'The SID is invalid'], a: 1, why: 'In passive IDS mode off a SPAN port, alerts are informational; the malicious SMB traffic was delivered and hosts must be checked for compromise.', whyNot: 'Suricata parses SMB fine; SPAN duplication is an engineering detail; SID validity is irrelevant.', trap: 'IDS alert ≠ attack prevented. Follow up on the targets.' },
    { q: 'Which Wireshark display filter shows only DNS queries containing the string "badcdn"?', opts: ['dns.qry.name contains "badcdn"', 'port 53 and badcdn', 'filter=dns:badcdn', 'show dns where name=badcdn'], a: 0, why: 'Wireshark display-filter syntax uses protocol.field operators; `contains` performs substring matching.', whyNot: '"port 53 and ..." is BPF capture-filter style; the others are invented syntax.', trap: 'Know the LOOK of both filter syntaxes — the exam shows you one and asks which tool/stage it belongs to.' },
    { q: 'Why does an inline IPS demand more careful rule tuning than a passive IDS?', opts: ['IPS rules cost more', 'False positives on an IPS block legitimate business traffic', 'IPS cannot log', 'IDS rules update automatically'], a: 1, why: 'Inline enforcement means every false positive is a self-inflicted denial of service on production traffic.', whyNot: 'Cost, logging, and update behaviour do not differ in the way described.' },
    { q: 'Threat intel provides a JA3 hash for a malware family\'s TLS client. Where can the SOC apply this indicator WITHOUT decrypting traffic?', opts: ['Endpoint registry keys', 'Zeek ssl.log / network sensor TLS metadata', 'Email headers', 'Windows event 4688'], a: 1, why: 'JA3 is computed from TLS ClientHello parameters visible on the wire; Zeek and modern NSM tools log it per session.', whyNot: 'Registry, email headers, and process events don\'t contain TLS handshake fingerprints.' },
  ],
  recap: [
    'tcpdump captures, Wireshark dissects; capture filters limit recording, display filters limit viewing',
    'IDS detects (passive), IPS blocks (inline) — inline FPs cause outages',
    'Zeek = structured network logs for hunting/retrospection; conn.log is the backbone',
    'JA3/metadata detect encrypted C2 without decryption',
  ],
});

DAYS.push({
  day: 9, domain: 1, icon: '📊', title: 'SIEM Mastery & Detection Engineering (Sigma)', minutes: 45,
  objectives: [
    'Explain the SIEM pipeline: ingestion → normalization → correlation → alerting',
    'Tune detections: thresholds, false positive management, alert fatigue',
    'Describe Sigma rules and detection-as-code; write basic queries',
  ],
  lesson: [
    { h: 'The SIEM pipeline', blocks: [
      { t: 'flow', x: [{ l: 'Collect', s: 'agents, syslog, APIs' }, { l: 'Normalize', s: 'parse to common fields' }, { l: 'Correlate', s: 'rules across sources' }, { l: 'Alert', s: 'to triage queue' }, { l: 'Retain', s: 'compliance & hunts' }] },
      { t: 'p', x: '**Correlation** is the value: one failed logon is noise; failed logons on 30 accounts from one IP within 5 minutes is a password spray. Rules combine events across sources and time windows.' },
      { t: 'code', x: 'Splunk-style spray detection:\nindex=wineventlog EventCode=4625\n| stats dc(user) as users count by src_ip\n| where users > 20 AND count > 40' },
      { t: 'list', x: [
        '**True positive** — alert fired, threat real. **False positive** — alert fired, benign. **False negative** — threat occurred, no alert (the dangerous one). **True negative** — quiet and clean.',
        '**Alert fatigue**: too many FPs → analysts tune out → real alerts missed. Fixes: tune thresholds, suppress known-benign, enrich alerts with context, aggregate duplicates.',
        'Tuning is a lifecycle: measure FP rate per rule, adjust, document, repeat.',
      ]},
      { t: 'warn', x: 'Tuning trap: raising a threshold to silence noise can create false negatives. The exam rewards options that reduce FPs while preserving detection (e.g., add context/exceptions) over blunt "raise the threshold/disable the rule."' },
    ]},
    { h: 'Detection engineering & Sigma', blocks: [
      { t: 'p', x: '**Sigma** is the vendor-neutral YAML format for SIEM detections — "YARA for logs." Write once, convert to Splunk/Sentinel/Elastic syntax with tooling. It powers detection sharing across the community and detection-as-code pipelines (rules in git, peer-reviewed, tested, auto-deployed).' },
      { t: 'code', x: 'title: Encoded PowerShell Execution\nlogsource: {product: windows, category: process_creation}\ndetection:\n  selection:\n    Image|endswith: \'\\powershell.exe\'\n    CommandLine|contains: \'-enc\'\n  condition: selection\nlevel: high\ntags: [attack.t1059.001]' },
      { t: 'list', x: [
        'Good detections map to **MITRE ATT&CK techniques** (the `tags` above → T1059.001 PowerShell).',
        'Detection-as-code: version control, review, CI tests against sample logs — the same rigour as software.',
        'AI assist (CS0-004): LLMs can draft Sigma/KQL rules from a description — always **validate against sample data** before deploying; hallucinated field names are common.',
      ]},
      { t: 'soc', x: 'You ask an AI assistant for a Sigma rule to catch scheduled-task persistence. It outputs a clean rule — referencing a log field your environment doesn\'t collect. Deployed as-is it would silently never fire: a false-negative factory. Human validation against real logs is non-negotiable.' },
    ]},
    { h: 'Working the queue like Tier 2', blocks: [
      { t: 'list', x: [
        'Read the alert → form a hypothesis → gather corroborating evidence from OTHER sources (EDR, DNS, proxy, identity) → decide TP/FP → document reasoning.',
        'Pivot on entities: the same source IP, user, or hash across data sources builds the incident picture.',
        'Escalate with evidence attached: timeline, affected assets, indicators, and your assessment — not just "looks bad."',
      ]},
      { t: 'exam', x: '"What should the analyst do NEXT?" questions: the answer is nearly always the next **validation/evidence** step, not immediate containment — unless the scenario shows active spreading damage.' },
    ]},
  ],
  flashcards: [
    { f: 'A threat occurred but no alert fired. What is this called?', b: 'False negative', exp: 'The most dangerous outcome — undetected compromise. Often caused by missing log sources, over-tuned thresholds, or broken parsing.', tip: 'FP wastes time; FN loses the network. Exam asks which is worse: FN.' },
    { f: 'What is Sigma?', b: 'A generic, vendor-neutral YAML signature format for SIEM detection rules', exp: 'Write once, convert to any SIEM query language — enables community detection sharing and detection-as-code.', tip: '"YARA for logs." Sigma=logs, YARA=files, Snort=network.' },
    { f: 'What causes alert fatigue and name two fixes.', b: 'Excessive false positives; fix by tuning rules with context/exceptions and aggregating/enriching alerts', exp: 'Fatigued analysts dismiss real threats. Blunt fixes (disable rule) trade FPs for FNs.', tip: 'Best answers preserve detection while cutting noise.' },
    { f: '30 accounts each receive one failed logon from one source IP. What attack does correlation reveal?', b: 'Password spraying', exp: 'Spraying tries one common password across many accounts, evading per-account lockouts; only cross-account correlation exposes it.', tip: 'Many users × few attempts = spray. One user × many attempts = brute force.' },
    { f: 'What is detection-as-code?', b: 'Managing detection rules like software: version control, peer review, automated testing, CI/CD deployment', exp: 'Brings repeatability and auditability to detection engineering; Sigma is the common rule format.' },
    { f: 'Why must AI-generated detection rules be validated against sample data?', b: 'LLMs hallucinate field names and logic that parse fine but never match real events (silent false negatives)', exp: 'A syntactically valid rule that references non-existent fields deploys cleanly and detects nothing.', tip: 'CS0-004 AI theme: human validation before production, always.' },
    { f: 'What does normalization do in the SIEM pipeline?', b: 'Parses diverse raw log formats into common field names so correlation rules work across sources', exp: 'Broken parsing = fields missing = correlation silently fails — a stealth cause of false negatives.' },
    { f: 'Where should a new detection idea be mapped for coverage tracking?', b: 'To MITRE ATT&CK techniques', exp: 'ATT&CK mapping shows which adversary behaviours you can and cannot detect (coverage gaps).' },
  ],
  quiz: [
    { sc: 'Rule: alert when failed logons > 5 per user per hour.\nResult: 400 alerts/day, ~98% from a service account with an expired password on three schedulers.', q: 'What is the BEST tuning action?', opts: ['Disable the rule', 'Raise the threshold to 500 per hour', 'Fix the expired credential and add a documented suppression for that service account pattern', 'Route the alerts to a folder nobody reads'], a: 2, why: 'Address the root cause and surgically suppress the documented benign source — noise drops, detection for everything else remains intact.', whyNot: 'Disabling creates blanket false negatives; threshold 500 blinds you to real brute force; ignoring alerts is alert fatigue institutionalised.', trap: 'The best tuning answer is always the narrowest change that kills the noise source.' },
    { q: 'Which sequence correctly orders the SIEM pipeline?', opts: ['Correlate → collect → alert → normalize', 'Collect → normalize → correlate → alert', 'Normalize → alert → collect → correlate', 'Alert → correlate → normalize → collect'], a: 1, why: 'Logs are collected, parsed into common fields, evaluated by correlation rules, and matching activity generates alerts.', whyNot: 'Correlation cannot precede collection/parsing; alerts are the output, not the input.' },
    { sc: 'Sigma rule fragment:\ndetection:\n  sel:\n    EventID: 4688\n    NewProcessName|endswith: \'\\schtasks.exe\'\n    CommandLine|contains: \'/create\'\n  condition: sel', q: 'What behaviour does this rule detect, and which ATT&CK tactic does it support?', opts: ['Log deletion — Defense Evasion', 'Scheduled task creation — Persistence', 'Password dumping — Credential Access', 'Port scanning — Discovery'], a: 1, why: 'schtasks.exe /create in process-creation events (4688) is the native Windows way to schedule tasks — the classic persistence technique (T1053.005).', whyNot: 'No log-clearing, credential, or scanning artefacts are referenced.', trap: 'Learn to READ Sigma/queries — the exam shows rule text and asks what it catches.' },
    { q: 'An analyst uses an AI assistant to draft a KQL detection, and it references the field `ProcessCommandLine_Full`, which does not exist in the schema. If deployed unchecked, what is the consequence?', opts: ['The SIEM crashes', 'Excessive false positives', 'The rule never matches — silent false negatives', 'License overuse'], a: 2, why: 'A query on a non-existent field returns nothing; the "coverage" exists on paper only. This is the hallucination risk of AI-assisted detection engineering.', whyNot: 'Bad field references don\'t crash platforms or create matches (FPs); licensing is unrelated.', trap: 'AI risk questions: the subtle failure (silent FN) beats the dramatic one (crash).' },
    { q: 'Alerts show single failed logons for 45 different users, all from 198.51.100.7, within 10 minutes — then one success. What happened?', opts: ['Users mistyped passwords after a password-policy change', 'Password spray that found one valid credential — treat the success as compromised', 'A vulnerability scan', 'Kerberos clock skew'], a: 1, why: 'One-attempt-per-account across many accounts is spraying; the single success means the attacker now has a working login that must be reset/contained.', whyNot: 'Policy-change typos wouldn\'t share one external source; scanners don\'t authenticate against 45 accounts; clock skew errors are a different event code pattern.', trap: 'When a spray question includes a success, the required action is on THAT account: reset, revoke sessions, investigate activity.' },
    { q: 'What is the PRIMARY benefit of writing detections in Sigma rather than directly in your SIEM\'s query language?', opts: ['Sigma rules execute faster', 'Portability across SIEM platforms and community rule sharing', 'Sigma rules cannot false-positive', 'Sigma bypasses licensing costs'], a: 1, why: 'Sigma is a portable abstraction: one YAML rule converts to Splunk SPL, Sentinel KQL, Elastic, etc., and the community publishes thousands of shareable rules.', whyNot: 'Execution speed depends on the backend; any rule can FP; licensing is unaffected.' },
  ],
  recap: [
    'Pipeline: collect → normalize → correlate → alert; broken parsing = silent false negatives',
    'FN is the dangerous error; tune surgically (root cause + narrow suppression), never bluntly',
    'Spray = many users/few attempts; brute force = one user/many attempts',
    'Sigma = portable detection-as-code mapped to ATT&CK; validate AI-drafted rules on real data',
  ],
});

DAYS.push({
  day: 10, domain: 1, icon: '✉️', title: 'Email, File Analysis & Sandboxing (SPF/DKIM/DMARC, YARA)', minutes: 45,
  objectives: [
    'Analyse email headers and authenticate senders with SPF, DKIM, DMARC',
    'Perform static file analysis: hashing, strings, VirusTotal',
    'Explain sandboxing (dynamic analysis) and YARA rule usage',
  ],
  lesson: [
    { h: 'Email authentication triad', blocks: [
      { t: 'table', head: ['Control', 'Question it answers', 'Mechanism'], rows: [
        ['SPF', 'Is this server allowed to send for the domain?', 'DNS TXT record lists authorized sending IPs'],
        ['DKIM', 'Was the message altered, and did the domain sign it?', 'Cryptographic signature in header, public key in DNS'],
        ['DMARC', 'What do we do when SPF/DKIM fail, and does the From: align?', 'Policy record: none / quarantine / reject + reporting'],
      ]},
      { t: 'code', x: 'Authentication-Results: mx.corp.com;\n  spf=fail (sender IP 203.0.113.9 not permitted)\n  dkim=none\n  dmarc=fail (p=quarantine)\nFrom: "CEO" <ceo@c0rp-payments.com>\nReply-To: attacker@freemail.example' },
      { t: 'list', x: [
        'Header analysis: walk **Received:** chains bottom-up (first hop = origin); compare **From**, **Return-Path**, and **Reply-To**; mismatches = impersonation.',
        '**Display-name spoofing** passes all three checks — "CEO Name <random@gmail.com>" authenticates fine because the sending domain is genuine.',
        'DMARC only protects **exact-domain** spoofing; lookalike domains (c0rp.com) require different controls.',
      ]},
      { t: 'exam', x: 'SPF = authorized IPs (DNS). DKIM = signature/integrity. DMARC = alignment + policy + reports. Know which failure means what.' },
    ]},
    { h: 'Static file analysis', blocks: [
      { t: 'list', x: [
        '**Hashing** (SHA-256): identify known files, prove integrity, search intel. Any byte change = new hash — trivially evaded by attackers, so hashes are the weakest (but fastest) IOC.',
        '**strings** extracts readable text: URLs, IPs, commands, ransom notes, imported function names hint at capability.',
        '**VirusTotal**: multi-engine verdicts + community intel on hashes/files/URLs. Caution: **uploading a file publishes it** — for sensitive/internal documents, search the hash instead of uploading.',
        'Packing/obfuscation: high entropy + few strings = packed binary; static analysis stalls → go dynamic.',
      ]},
      { t: 'warn', x: 'VirusTotal OPSEC is a real exam point: uploading a targeted-attack sample or a sensitive doc leaks it to the world (including the attacker, who can see detection). Hash lookup first.' },
    ]},
    { h: 'Dynamic analysis & YARA', blocks: [
      { t: 'p', x: '**Sandboxing** (Joe Sandbox, Cuckoo, Any.Run) detonates a sample in an instrumented VM and records behaviour: processes spawned, files dropped, registry changes, network callouts. Defeats packing — behaviour cannot hide at runtime.' },
      { t: 'list', x: [
        'Malware counters: sandbox-detection (checks VM artefacts, mouse movement, uptime), time-delayed execution, geofencing. A "clean" sandbox verdict is not proof of safety.',
        '**YARA** — pattern-matching rules for files/memory: strings + conditions identify malware families. Used in EDR scans, IR triage, and intel sharing.',
      ]},
      { t: 'code', x: 'rule Emotet_Loader {\n  strings:\n    $s1 = "schtasks /create" ascii\n    $s2 = {6A 40 68 00 30 00 00}\n    $url = /https?:\\/\\/[a-z0-9]{12}\\.xyz/ \n  condition:\n    2 of them and filesize < 900KB\n}' },
      { t: 'tip', x: 'Tool → scope mapping to memorise: **YARA = files/memory**, **Sigma = logs**, **Snort/Suricata = network packets**. Three signature languages, three data types.' },
    ]},
  ],
  flashcards: [
    { f: 'Which email control publishes authorized sending IPs in a DNS TXT record?', b: 'SPF (Sender Policy Framework)', exp: 'Receiving servers check whether the connecting IP is listed for the envelope-from domain.', tip: 'SPF=IPs, DKIM=signature, DMARC=policy/alignment.' },
    { f: 'What does a DMARC policy of p=reject instruct receivers to do?', b: 'Refuse delivery of messages failing SPF/DKIM alignment for that domain', exp: 'DMARC adds enforcement + reporting on top of SPF/DKIM; policies: none (monitor), quarantine (spam-folder), reject (block).' },
    { f: 'A phishing email passes SPF, DKIM, and DMARC. How?', b: 'Display-name spoofing or a lookalike domain — the attacker legitimately owns the sending domain', exp: 'Authentication proves the message came from the domain it claims — not that the domain is trustworthy.', tip: 'Auth pass ≠ safe. Exam loves this nuance.' },
    { f: 'In header analysis, which Received: header shows the true origin?', b: 'The bottom one (first hop) — headers are prepended as the mail travels', exp: 'Read Received chains bottom-up; also compare From, Return-Path, and Reply-To for mismatches.' },
    { f: 'Why search a hash on VirusTotal instead of uploading the file?', b: 'Uploads become publicly accessible — leaking sensitive content and tipping off targeted attackers', exp: 'Hash lookup gives intel without disclosure; upload only non-sensitive commodity samples.', tip: 'OPSEC point CompTIA tests explicitly.' },
    { f: 'A binary has almost no readable strings and very high entropy. What does this suggest and what next?', b: 'The file is packed/obfuscated — pivot to dynamic (sandbox) analysis', exp: 'Packing defeats static string/signature review; runtime behaviour in a sandbox reveals the real payload.' },
    { f: 'What is YARA used for?', b: 'Pattern-matching rules to identify/classify malware in files and memory', exp: 'Rules combine strings, hex patterns, and conditions; used in IR triage, EDR scans, and threat intel.', tip: 'YARA=files, Sigma=logs, Snort=network.' },
    { f: 'Name two ways malware evades sandboxes.', b: 'Detecting VM/sandbox artefacts and delaying execution (or requiring user interaction/geolocation)', exp: 'Hence a clean sandbox report is evidence, not proof — correlate with other analysis.' },
  ],
  quiz: [
    { sc: 'Authentication-Results:\n spf=pass (ip 209.85.x.x permitted for gmail.com)\n dkim=pass header.d=gmail.com\n dmarc=pass\nFrom: "Maria Chen, CFO" <maria.chen.cfo.corp@gmail.com>\nSubject: URGENT wire needed today', q: 'All checks pass. What is the correct assessment?', opts: ['Legitimate — authentication passed', 'Display-name impersonation from a free-mail account — BEC attempt', 'SPF record misconfiguration', 'DKIM replay attack'], a: 1, why: 'The mail genuinely came from gmail.com — that\'s all "pass" means. A CFO title on a free-mail address with wire-transfer urgency is textbook BEC.', whyNot: 'Authentication ≠ legitimacy; SPF/DKIM behaved exactly as designed.', trap: 'The exam WILL show you passing auth on a phish. Authenticate the domain, then judge the domain.' },
    { q: 'An analyst receives a suspicious attachment from a spear-phishing email targeting the CEO. What is the FIRST analysis step?', opts: ['Upload the file to VirusTotal', 'Compute its hash and search that hash in VirusTotal/intel platforms', 'Open it on the analyst workstation to observe', 'Delete it immediately'], a: 1, why: 'Hash lookup gets intel with zero disclosure. For a targeted sample, uploading would reveal to the attacker their payload is discovered.', whyNot: 'Uploading leaks targeted samples; opening outside a sandbox risks infection; deleting destroys evidence.', trap: 'Targeted/sensitive = hash search only. Commodity spam sample = upload acceptable.' },
    { q: 'The sandbox report for a suspected malicious document shows no malicious behaviour. Which conclusion is MOST appropriate?', opts: ['The file is confirmed safe', 'The file may be sandbox-aware, time-delayed, or environment-dependent — corroborate with static analysis and intel', 'The sandbox is broken', 'The document should be released to the user'], a: 1, why: 'Evasion techniques (VM detection, sleep timers, geofencing, required user interaction) routinely produce clean runs for real malware.', whyNot: '"Confirmed safe" over-trusts one tool; nothing suggests sandbox malfunction; release requires a holistic verdict.', trap: 'Absence of evidence in ONE tool is not evidence of absence.' },
    { sc: 'strings output (suspicious.exe):\n  cmd /c vssadmin delete shadows /all /quiet\n  taskkill /IM sqlservr.exe\n  READ_ME_RESTORE.txt', q: 'What malware type do these strings indicate?', opts: ['Cryptominer', 'Keylogger', 'Ransomware', 'Adware'], a: 2, why: 'Deleting Volume Shadow Copies (killing restore points), stopping database services (unlocking files for encryption), and a ransom-note filename are the ransomware triad.', whyNot: 'Miners reference pools/wallets; keyloggers hook input APIs; adware serves ads.', trap: '`vssadmin delete shadows` is THE ransomware pre-encryption command — memorise it.' },
    { q: 'Which detection technology would you use to scan thousands of endpoints\' memory for a specific malware family\'s patterns?', opts: ['Sigma rules', 'YARA rules via EDR', 'Snort signatures', 'SPF records'], a: 1, why: 'YARA matches byte/string patterns in files and memory; EDR platforms distribute YARA scans fleet-wide.', whyNot: 'Sigma matches log events, Snort matches packets, SPF is email authentication.', trap: 'Match the signature language to the data type — memory/files = YARA.' },
    { q: 'A company wants visibility into who is spoofing its domain before enforcing blocking. Which configuration achieves this?', opts: ['DMARC p=none with rua reporting', 'DMARC p=reject immediately', 'Removing the SPF record', 'DKIM with a 512-bit key'], a: 0, why: 'p=none (monitor mode) collects aggregate reports showing all sources sending as the domain — the standard first phase before quarantine/reject.', whyNot: 'Immediate reject risks breaking legitimate third-party senders; removing SPF destroys authentication; 512-bit DKIM keys are insecure.', trap: 'DMARC rollout order: none → quarantine → reject.' },
  ],
  recap: [
    'SPF=authorized IPs, DKIM=signature, DMARC=alignment+policy(none/quarantine/reject)+reports',
    'Auth pass ≠ safe: display-name spoofing and lookalikes sail through',
    'Hash-search before upload; packed binaries → sandbox; clean sandbox ≠ clean file',
    'vssadmin delete shadows = ransomware tell; YARA files, Sigma logs, Snort network',
  ],
});

DAYS.push({
